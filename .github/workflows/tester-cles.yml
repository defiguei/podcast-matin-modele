name: Tester mes clés
run-name: Tester mes clés ${{ inputs.cles }}

# Lancé par le bouton « Tester » de l'application (Réglages › Gemini, ou Réglages › Sources › Services) pour une clé
# rangée dans les secrets GitHub, que le bot ne voit pas. Teste la clé (sans la montrer)
# et renvoie au bot ce qu'il faut en savoir : modèles disponibles, recherches restantes…
# À la main : Run workflow (vide = toutes les clés). Le résultat est aussi dans le résumé.

on:
  workflow_dispatch:
    inputs:
      cles:
        description: "Clés à tester : gemini, tavily, sncf (vide : toutes)"
        required: false
        default: ""
      outils:
        description: "Outils à tester d'ici (envoyé par le bot quand un service refuse ses questions)"
        required: false
        default: ""

permissions:
  contents: read

env:
  BOT_URL: ${{ vars.BOT_URL || 'https://podcast.TON-SOUS-DOMAINE.workers.dev' }}

jobs:
  cles:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Préparer Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Tester les clés
        env:
          CLES: ${{ inputs.cles }}
          OUTILS: ${{ inputs.outils }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          SNCF_API_KEY: ${{ secrets.SNCF_API_KEY }}
          BOT_GITHUB_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: node cloudflare/tester-cles.mjs
