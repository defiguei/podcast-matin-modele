// Bot d'avant le genre : on retombe sur la famille.
const GENRE_PAR_FAMILLE = { jour: "meteo", info: "libre", sortie: "sortie", agenda: "rappel" };
const genreDe = (r) => (r && (GENRES[r.genre] ? r.genre : GENRE_PAR_FAMILLE[r.famille])) || "libre";
function pastille(genre, taille = 20, mini = false) {
  const g = GENRES[genre] || GENRES.libre;
  return `<span class="${mini ? "pastille-mini" : "pastille"} genre" style="--g:${g.couleur}">${icone(g.icone, taille)}</span>`;
}

function resumeIntegree(cle) {
  const r = S.d.reglages;
  const n = ((r.consignes_rubriques || {})[cle] || []).length;
  const base = resumeReglagesIntegree(cle);
  return n ? `${base}${base ? " · " : ""}${n} consigne${n > 1 ? "s" : ""}` : base;
}

const pluriel = (n, mot) => `${n} ${mot}${n > 1 ? "s" : ""}`;

function resumeReglagesIntegree(cle) {
  const r = S.d.reglages, lus = r.agendas.filter((a) => !r.agenda.exclus.includes(a.id)).length;
  switch (cle) {
    case "ouverture": return "Salutation et programme";
    case "agenda": return `${r.agenda.jours} jours à l'avance${r.agendas.length ? ` · ${lus} agenda${lus > 1 ? "s" : ""}` : ""}`;
    case "deplacements": return r.agenda.deplacements ? `Si un voyage approche (${r.agenda.jours_deplacements} j)` : "Repérage désactivé";
    case "actu_locale": return r.actus.ville ? `${r.actus.ville} · ${pluriel(r.actus.locale_sujets, "sujet")} · ${r.actus.locale_articles} lus` : "Ville à préciser (Réglages › Moi)";
    case "approfondissements": return r.a_approfondir.length ? `${r.a_approfondir.length} sujet${r.a_approfondir.length > 1 ? "s" : ""} au prochain épisode` : "Quand tu demandes de creuser";
    case "actualites": return `${pluriel(r.format.nombre_sujets, "sujet")} · ${r.actus.articles} lus · ${r.actus.flux.length} flux`;
    case "cloture": return "Premier rendez-vous et mot de la fin";
    default: return "";
  }
}

const MOMENTS_TEXTE = { jour_meme: "le jour même", veille: "la veille", jours_avant: "quelques jours avant" };
// Quand la rubrique passe (« Toujours », « Les lundis », « Jusqu'au 20 oct. »), en orange.
const quand = (r) => r && r.periode_texte ? `<span class="quand">${h(majuscule(r.periode_texte))}</span>` : "";

function detailRubrique(r) {
  const morceaux = [quand(r)];
  if (r.condition) morceaux.push(h(`si l'agenda contient « ${r.condition.texte} » ${MOMENTS_TEXTE[r.condition.moment] || ""}`.trim()));
  if (r.etat === "terminee") morceaux.unshift("Terminée");
  else if (r.pause) morceaux.unshift("En pause");
  else if (r.etat === "a_venir" && r.prochain) morceaux.push(h(`prochain : ${r.prochain}`));
  morceaux.push(h(r.longueur ? LONGUEURS[r.longueur] : "glissée"));
  return morceaux.filter(Boolean).join(" · ");
}

function carteRubrique(r) {
  const detail = r.periode.type === "ponctuelle"
    ? h(r.derniere_application ? `Dernière recherche le ${dateLongue(r.derniere_application)}` : r.consigne)
    : detailRubrique(r);
  return `<button type="button" class="rubrique" data-ouvrir="${h(r.id)}">
    ${pastille(genreDe(r))}
    <span class="textes"><span class="nom">${h(r.titre)}</span><span class="detail">${detail}</span></span>
    ${r.importance === "prioritaire" ? '<span class="puce prio">Prioritaire</span>' : `<span style="color:var(--eteint)">${icone("suite", 18, 2)}</span>`}
  </button>`;
}

// Ce qui s'applique un jour donné (même règle que le bot pour les périodes).
function appliqueLe(r, date) {
  if (r.pause) return false;
  const p = r.periode;
  if (p.type === "ponctuelle") return false;
  if (p.type === "une_fois") return !r.servie && Boolean(S.d.prochain) && date === S.d.prochain.date;
  if (p.debut && date < p.debut) return false;
  if (p.fin && date > p.fin) return false;
  if (p.type === "jours" && p.jours.length && !p.jours.includes(CLES_JOURS[dateObj(date).getUTCDay()])) return false;
  return true;
}

// ─────────────────────────────── ton épisode ────────────────────────────
// Toutes les rubriques qu'on entend, dans l'ordre : fournies et créées, une seule liste.
function ligneProgramme(x, i, fixe) {
  const r = x.integree ? null : S.d.regles.find((y) => y.id === x.cle);
  const actif = x.actif && !(r && r.pause);
  const marque = pastille(x.integree ? x.cle : genreDe(r), 17, true);
  const detail = x.integree ? h(resumeIntegree(x.cle)) : r ? detailRubrique(r) : "";
  const cible = x.integree ? `data-integree="${h(x.cle)}"` : `data-ouvrir="${h(x.cle)}"`;
  const textes = `<button type="button" class="textes" ${cible}><span class="nom">${h(x.nom)}</span><span class="detail">${detail}</span></button>`;
  if (fixe) {
    return `<li class="fixe${x.integree ? " fournie" : ""}" data-cle="${h(x.cle)}"><span class="num">${i + 1}</span>${marque}${textes}
      <span class="mini-inter" style="color:var(--eteint)" role="img" aria-label="Position fixe">${icone("cadenas", 18)}</span></li>`;
  }
  const interrupteurLigne = x.integree ? `data-actif="${h(x.cle)}"` : `data-actif-regle="${h(x.cle)}"`;
  return `<li class="mobile${x.integree ? " fournie" : ""} ${actif ? "" : "eteint"}" data-cle="${h(x.cle)}">
    <span class="num">${i + 1}</span>${marque}${textes}
    <button type="button" class="mini-inter" role="switch" aria-checked="${actif}" ${interrupteurLigne} aria-label="${h(x.nom)} : ${actif ? "active" : "en pause"}"><span class="rail"><span></span></span></button>
    <button type="button" class="poignee" data-poignee aria-label="Déplacer ${h(x.nom)} (flèches haut et bas)">${POIGNEE}</button>
  </li>`;
}

function vueProgramme() {
  const d = S.d;
  if (S.jourVue.deroule) return `<h1>Ton épisode</h1>${choixJour("deroule")}${vueProgrammeDuJour(S.jourVue.deroule)}`;
  const liste = d.deroule;
  const fixe = (i) => (i === 0 && liste[i].cle === "ouverture") || (i === liste.length - 1 && liste[i].cle === "cloture");
  const sansPassage = d.regles.filter((r) => !r.longueur && r.periode.type !== "ponctuelle");
  const glissees = sansPassage.filter((r) => !r.pause && r.etat !== "terminee");
  const arretees = sansPassage.filter((r) => r.pause || r.etat === "terminee");
  return `
  <h1>Ton épisode</h1>
  ${choixJour("deroule")}
  <ol class="deroule" id="deroule">${liste.map((x, i) => ligneProgramme(x, i, fixe(i))).join("")}</ol>
  <p class="aide">Touche une rubrique pour la régler. Fais-la glisser par sa poignée pour changer l'ordre ; l'interrupteur la met en pause.</p>
  ${glissees.length ? `<span class="groupe">Glissées dans l'épisode</span>
    <p class="aide">Pas de moment à elles : les animateurs les placent là où c'est naturel.</p>
    <div class="liste">${glissees.map(carteRubrique).join("")}</div>` : ""}
  ${arretees.length ? `<span class="groupe">En pause ou terminées</span><div class="liste">${arretees.map(carteRubrique).join("")}</div>` : ""}
  <button type="button" class="bouton plein" data-aller="catalogue">${icone("plus", 20, 2.2)}Ajouter une rubrique</button>`;
}

// Le programme d'une date : seulement ce qui passe ce jour-là, dans l'ordre (lecture seule).
function vueProgrammeDuJour(date) {
  const d = S.d, c = jourCalendrier(date);
  const lignes = [];
  for (const x of d.deroule) {
    if (!x.actif) continue;
    const r = x.integree ? null : d.regles.find((y) => y.id === x.cle);
    if (r && !appliqueLe(r, date)) continue;
    const detail = x.integree ? (SI_CONTENU.includes(x.cle) ? "S'il y a de quoi en parler" : resumeIntegree(x.cle))
      : r && r.condition ? `si l'agenda contient « ${r.condition.texte} » ${MOMENTS_TEXTE[r.condition.moment] || ""}` : (r && LONGUEURS[r.longueur]) || "";
    const cible = x.integree ? `data-integree="${h(x.cle)}"` : `data-ouvrir="${h(x.cle)}"`;
    const marque = pastille(x.integree ? x.cle : genreDe(r), 17, true);
    lignes.push(`<li class="${x.integree ? "fournie" : ""}" data-cle="${h(x.cle)}"><span class="num">${lignes.length + 1}</span>${marque}
      <button type="button" class="textes" ${cible}><span class="nom">${h(x.nom)}</span><span class="detail">${h(detail)}</span></button></li>`);
  }
  const glissees = d.regles.filter((r) => !r.longueur && r.periode.type !== "ponctuelle" && appliqueLe(r, date));
  const etat = c.heure ? `Épisode à ${heure(c.heure)}` : c.pause ? "Pas d'épisode ce jour-là (pause)" : "Pas d'épisode prévu ce jour-là";
  return `<p class="aide" style="font-size:14px;color:var(--doux-2)">${h(majuscule(dateLongue(date)))} · ${h(etat)} · ${lignes.length} passages</p>
    <ol class="deroule">${lignes.join("")}</ol>
    ${glissees.length ? `<span class="groupe">Glissées ce jour-là</span><div class="liste">${glissees.map(carteRubrique).join("")}</div>` : ""}
    <p class="aide">Pour changer l'ordre ou mettre une rubrique en pause, reviens à « Tous les jours ».</p>`;
}

// ─────────────────────────────── catalogue ──────────────────────────────
// Modèles déjà réglés (fournis par le bot : les mêmes que pour une rubrique demandée à la voix).
// L'application choisit les sources d'après la consigne.
const modeles = () => (S.d && S.d.modeles) || [];

function vueCatalogue() {
  const d = S.d;
  // Une ligne par modèle (on l'ajoute) ; les rubriques de base se règlent par un interrupteur : une seule de chacune.
  const ligneModele = (m) => `<button type="button" class="rubrique" data-modele="${m.id}">
    ${pastille(m.id)}
    <span class="textes"><span class="nom">${h(m.titre)}</span><span class="detail" style="white-space:normal">${h(m.texte)}</span></span>
    <span style="color:var(--eteint)">${icone("suite", 18, 2)}</span></button>`;
  const ligneBase = (x) => `<div class="rubrique base">
    ${pastille(x.cle)}
    <button type="button" class="textes" data-integree="${h(x.cle)}" style="background:none;border:0;padding:0;text-align:left;color:inherit"><span class="nom">${h(x.nom)}</span><span class="detail" style="white-space:normal">${h(INTEGREES[x.cle].texte)}</span></button>
    <button type="button" class="mini-inter" role="switch" aria-checked="${x.actif}" data-actif-integree="${h(x.cle)}" aria-label="${h(x.nom)} : ${x.actif ? "dans mes épisodes" : "absente de mes épisodes"}"><span class="rail"><span></span></span></button></div>`;
  const bases = d.deroule.filter((x) => x.integree && !INTEGREES[x.cle].fixe);
  const sections = (d.categories_rubriques || []).map((c) => {
    const lignes = c.id === "basiques" ? bases.map(ligneBase) : modeles().filter((m) => m.categorie === c.id).map(ligneModele);
    return lignes.length ? `<span class="groupe">${h(c.titre)}</span><p class="aide" style="margin:0">${h(c.texte)}</p><div class="liste">${lignes.join("")}</div>` : "";
  });
  return `${entete("Ajouter une rubrique", "Ton épisode")}
  <p class="aide" style="font-size:14px;color:var(--doux-2)">Choisis un modèle : il est déjà réglé. Tu pourras tout ajuster avant de l'ajouter.</p>
  ${sections.join("")}
  <p class="aide">Pour une recherche ponctuelle (une sortie ce samedi, une idée de cadeau…), passe par l'onglet Recherches : elle ne s'ajoute pas à tes épisodes.</p>`;
}

// ───────────────────────────────── recherches ──────────────────────────────
// Deux types : en podcast ou par écrit. Ta demande et les sources cochées font le reste. Chaque
// recherche s'ouvre sur sa page de résultats ; sa configuration se change depuis cette page.
const resultatsDe = (id) => ((S.d && S.d.recherches_resultats) || {})[id] || null;
const quandCourt = (iso) => iso ? `${dateCourteLocale(iso.slice(0, 10))} à ${iso.slice(11, 16).replace(":", "h")}` : "";
const texteRecherches = (n) => `${n} recherche${n > 1 ? "s" : ""} web`;

// Une ligne de résumé : type, réglage, et où en sont les résultats.
function resumeRecherche(r) {
  const res = resultatsDe(r.id), podcast = r.rendu === "point";
  const type = podcast ? `Podcast · ${r.minutes || 3} min` : "Par écrit";
  if (res && res.en_cours) return `${type} · en cours…`;
  if (!res || !res.quand) return `${type} · pas encore lancée`;
  const n = podcast ? "" : ` · ${pluriel(((res.details[0] || {}).idees || []).length, "résultat")}`;
  return `${type}${n} · ${dateCourteLocale(res.quand.slice(0, 10))}`;
}

function carteRecherche(r) {
  const podcast = r.rendu === "point", res = resultatsDe(r.id);
  return `<button type="button" class="rubrique" data-resultats="${h(r.id)}">
    <span class="pastille genre" style="--g:${podcast ? "#F2A65A" : "#85B6F4"}">${icone(podcast ? "casque" : "actus", 20)}</span>
    <span class="textes"><span class="nom">${h(r.titre)}</span><span class="detail">${h(resumeRecherche(r))}</span></span>
    ${res && res.en_cours ? `<span class="attente petite" role="img" aria-label="En cours"></span>` : `<span style="color:var(--eteint)">${icone("suite", 18, 2)}</span>`}
  </button>`;
}

function vueIdees() {
  const ordre = (r) => { const res = resultatsDe(r.id); return res && res.en_cours ? "~" : (res && res.quand) || r.derniere_application || ""; };
  const recherches = S.d.regles.filter((r) => r.periode.type === "ponctuelle").sort((a, b) => ordre(b).localeCompare(ordre(a)));
  return `<h1>Recherches</h1>
  <p class="aide" style="font-size:14px;color:var(--doux-2)">Décris ce que tu veux et choisis où chercher : la réponse arrive en podcast ou par écrit, ici, sans toucher à tes épisodes.</p>
  <button type="button" class="bouton plein" data-action="nouveau-point">${icone("plus", 20, 2.2)}Nouvelle recherche</button>
  ${recherches.length ? `<span class="groupe">Tes recherches</span><div class="liste">${recherches.map(carteRecherche).join("")}</div>`
    : `<div class="vide">Aucune recherche pour l'instant.</div>`}`;
}

// Les sources d'un résultat (podcast) : numérotées, avec le site.
const listeSources = (sources) => `<div class="sources">${sources.map((x) => ligneSource(x.titre, x.lien)).join("")}</div>`;

// Un résultat écrit : une idée (lieu, prix, accès, carte) ou une information (résumé, source, lien).
function carteResultat(i, nouveau) {
  const site = i.lien ? i.lien.replace(/^https:\/\/(www\.)?/, "").split("/")[0] : "";
  const infos = [i.lieu ? `<span>${h(i.lieu)}</span>` : "", i.prix ? `<span class="${i.dans_le_budget ? "ok" : ""}">${h(i.prix)}</span>` : "",
    i.duree ? `<span>${h(i.duree)}</span>` : "", i.horaires ? `<span>${h(i.horaires)}</span>` : "",
    !i.lieu && (i.source || site) ? `<span>${h(i.source || site)}</span>` : ""].join("");
  return `<article class="idee">
    <div class="entre" style="align-items:flex-start"><h3>${h(i.titre)}</h3>${nouveau ? `<span class="puce prio">Nouveau</span>` : ""}</div>
    ${infos ? `<div class="infos">${infos}</div>` : ""}
    ${i.resume ? `<p style="margin:0;line-height:1.45">${h(i.resume)}</p>` : ""}
    ${i.pourquoi ? `<p class="aide">${h(i.pourquoi)}</p>` : ""}
    ${i.acces ? `<p class="aide">Accès : ${h(i.acces)}</p>` : ""}
    <div class="gestes compacts">${i.lien ? `<button type="button" data-lien="${h(i.lien)}">Voir ${i.lieu ? "le site" : "l'article"}</button>` : ""}
      ${i.adresse || i.lieu ? `<button type="button" data-lien="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(i.adresse || i.lieu)}">Carte</button>` : ""}
      <button type="button" data-creuser="${h(i.titre)}">En parler demain</button></div>
  </article>`;
}

// La page d'une recherche : son dernier podcast ou ses résultats écrits, et de quoi les relancer.
// « Modifier », en haut à droite : sa configuration.
function vueResultatsRecherche(id) {
  const r = S.d.regles.find((x) => x.id === id && x.periode.type === "ponctuelle");
  if (!r) return `${entete("Recherche", "Recherches")}<div class="vide">Cette recherche n'existe plus.</div>`;
  const res = resultatsDe(id), podcast = r.rendu === "point";
  const enCours = res && res.en_cours, det = res && res.details[0];
  const lieux = sourcesActives(r.sources).map((cle) => infoSource(cle).nom).join(", ");
  const reglage = podcast ? `${r.minutes || 3} min` : texteRecherches(r.recherches || 3);
  const attente = enCours ? `<div class="encours" role="status"><span class="attente" aria-hidden="true"></span><span>${enCours.format === "plus" ? "Je cherche d'autres résultats" : podcast ? "Le podcast se prépare" : "Je cherche"} depuis ${h(enCours.depuis ? enCours.depuis.slice(11, 16).replace(":", "h") : "un instant")} : ${podcast ? "il arrive ici d'ici trois ou quatre minutes" : "les résultats arrivent ici d'ici une à deux minutes"}.</span></div>` : "";
  const entree = `${entete(r.titre, podcast ? "Recherche en podcast" : "Recherche par écrit", `<button type="button" class="lien" style="padding:0 10px" data-action="modifier-recherche">Modifier</button>`)}
    <p class="demande">${h(r.consigne)}</p>
    <p class="aide" style="margin-top:-8px">${h(reglage)}${lieux ? ` · ${h(lieux)}` : ""}</p>
    ${attente}`;
  const sources = (liste) => liste && liste.length ? `<section class="carte">${enteteRepli("Sources", "sources_recherche", !S.replis.sources_recherche)}${S.replis.sources_recherche ? "" : listeSources(liste)}</section>` : "";
  if (podcast) {
    return `${entree}
    ${res && res.episode ? `<section class="carte">
        <div style="display:flex;flex-direction:column;gap:2px"><h2>${h(res.episode.titre)}</h2><span class="aide">Le ${h(quandCourt(res.quand))}</span></div>
        ${vueLecteur(res.episode)}
        ${det && det.intro ? `<p class="aide" style="font-size:14px;color:var(--doux-2)">Abordé : ${h(det.intro)}</p>` : ""}
      </section>${sources(det && det.sources)}`
      : enCours ? "" : `<div class="vide">Pas encore de podcast pour cette recherche.</div>`}
    <button type="button" class="bouton plein" data-relancer="point" ${enCours ? "disabled" : ""}>${icone("casque", 20)}${res && res.episode ? "Nouveau podcast" : "Lancer le podcast"}</button>`;
  }
  const idees = det ? det.idees : [];
  return `${entree}
    ${det ? `<p class="aide">Le ${h(quandCourt(res.quand))} · ${pluriel(idees.length, "résultat")}</p>
      ${det.intro ? `<p style="margin:0;line-height:1.5">${h(det.intro)}</p>` : ""}
      ${idees.map((i, k) => carteResultat(i, res.nouveaux > 0 && k >= idees.length - res.nouveaux)).join("")}
      ${det.conseil ? `<p class="aide">${h(det.conseil)}</p>` : ""}
      ${sources(det.sources)}`
      : enCours ? "" : `<div class="vide">Pas encore de résultats pour cette recherche.</div>`}
    ${det ? `<div class="deux"><button type="button" class="bouton gris" data-relancer="plus" ${enCours ? "disabled" : ""}>Plus de résultats</button>
        <button type="button" class="bouton plein" data-relancer="ecrit" ${enCours ? "disabled" : ""}>Nouveaux résultats</button></div>`
      : `<button type="button" class="bouton plein" data-relancer="ecrit" ${enCours ? "disabled" : ""}>Lancer la recherche</button>`}`;
}

// Tant qu'une recherche est en cours, la page (liste ou résultats) se remet à jour toute seule.
let suiviRecherches = null;
function suivreRecherches() {
  if (suiviRecherches || !S.d) return;
  const enCours = () => Object.entries(S.d.recherches_resultats || {}).filter(([, x]) => x.en_cours).map(([id]) => id);
  if (!enCours().length) return;
  suiviRecherches = setTimeout(async () => {
    suiviRecherches = null;
    if (!["idees", "resultats"].includes(S.ecran) || document.visibilityState !== "visible") return;
    const avant = enCours();
    const j = await demander("etat", {}, { discret: true });
    if (j.occupe) return suivreRecherches();
    if (!j.ok || !["idees", "resultats"].includes(S.ecran)) return;
    const arrivees = avant.filter((id) => !enCours().includes(id) && (resultatsDe(id) || {}).quand);
    if (arrivees.length) { vibrer("success"); annoncer(arrivees.includes(S.recherche) ? "C'est arrivé." : "Une recherche est arrivée."); }
    dessiner();
  }, 15000);
}

// ───────────────────────────────── fiche ────────────────────────────────
const PERIODES_RUBRIQUE = PERIODES.filter(([cle]) => cle !== "ponctuelle");
const MINUTES_RECHERCHE = [2, 3, 5, 8, 10];

function ouvrirFiche(id, modele = null, origine = null) {
  S.resumeOuvert = null;
  const r = id ? S.d.regles.find((x) => x.id === id) : null;
  if (id && !r) return annoncer("Cette rubrique n'existe plus.", true);
  if (r && r.periode.type === "ponctuelle") S.recherche = r.id;
  const vide = { quoi: "", avec_qui: "", ages: "", ou: "", quand: "", attendu: "" };
  const m = modele || {};
  const base = typeof m.f === "function" ? m.f(S.d.reglages.actus.ville) : (m.f || {});
  const ponctuelle = r ? r.periode.type === "ponctuelle" : m.id === "recherche" || m.id === "point";
  const rendu = r ? r.rendu || "idees" : m.id === "point" ? "point" : "idees";
  S.fiche = {
    id: r ? r.id : null, modifie: Boolean(!r && m.depuisConsigne !== undefined),
    origine: origine || (ponctuelle ? (r ? "resultats" : "idees") : r ? "programme" : "catalogue"),
    details: false,
    depuisConsigne: m.depuisConsigne,
    modeleNom: m.titre || "",
    // Détails de recherche montrés seulement s'ils servent (un suivi de train n'en a pas besoin).
    recherche: Boolean(r && r.recherche && (Object.values(r.fiche).some(Boolean) || r.budget.max !== null || r.inclure.length || r.exclure.length))
      || Boolean(m.recherche) || ponctuelle,
    f: {
      titre: r ? r.titre : base.titre || "", consigne: r ? r.consigne : base.consigne || "",
      longueur: r ? (r.longueur || "aucune") : ponctuelle ? "aucune" : base.longueur || "courte",
      periode: r ? { type: r.periode.type, debut: r.periode.debut || "", fin: r.periode.fin || "", jours: [...(r.periode.jours || [])] }
                 : { type: ponctuelle ? "ponctuelle" : "toujours", debut: "", fin: "", jours: [], ...(base.periode || {}) },
      sources: r ? [...r.sources] : sourcesProposables(ponctuelle ? m.sources || ["web", "actus"] : [...(m.sources || [])]),
      modele: r ? r.modele || "libre" : ponctuelle ? "libre" : m.id || "libre",
      rendu, audio: false, minutes: r ? r.minutes || 3 : m.minutes || 3, recherches: r ? r.recherches || 3 : 3,
      fiche: r ? { ...vide, ...r.fiche } : { ...vide },
      transport: r ? r.transport : "aucun",
      budget: r ? { max: r.budget.max ?? "", unite: r.budget.unite || "personne", devise: r.budget.devise || S.d.devise || "CHF", transport_inclus: Boolean(r.budget.transport_inclus) }
                : { max: "", unite: "personne", devise: S.d.devise || "CHF", transport_inclus: false },
      inclure: r ? [...r.inclure] : [], exclure: r ? [...r.exclure] : [],
      condition: r && r.condition ? { ...r.condition } : base.condition ? { ...base.condition } : null,
      place: r ? r.place : base.place || "actualites",
      prioritaire: r ? r.importance === "prioritaire" : false,
      active: r ? !r.pause : true,
    },
  };
  S.ecran = "fiche";
  dessiner();
  window.scrollTo(0, 0);
}

function blocRecherche(f) {
  return `<div class="sous-bloc">
      <span class="etiquette" style="font-size:13px;color:var(--doux)">Détails pour la recherche</span>
      ${champsRecherche(f)}
    </div>`;
}

// Recherche ponctuelle : « Détails de la recherche » s'ouvre et se ferme ; fermé, une phrase dit ce qui est réglé.
function detailsRecherche(F, f) {
  const ouvert = Boolean(F.details);
  return `<div class="sous-bloc details-recherche">
      <button type="button" class="tete-repli" data-action="details" aria-expanded="${ouvert}" aria-controls="details-champs">
        <span class="textes"><span class="titre-details">Détails de la recherche</span>${ouvert ? "" : `<span class="resume-details">${h(resumeDetails(f))}</span>`}</span>${icone("suite", 18, 2)}</button>
      ${ouvert ? `<div id="details-champs" style="display:flex;flex-direction:column;gap:10px">${champsRecherche(f)}</div>` : ""}
    </div>`;
}

// Les détails réglés, en une phrase (« Activité en famille, avec 2 adultes et 2 enfants (6 et 9 ans), à Lausanne… »).
function resumeDetails(f) {
  const x = f.fiche, morceaux = [];
  if (x.quoi) morceaux.push(x.quoi);
  if (x.avec_qui) morceaux.push(`avec ${x.avec_qui}${x.ages ? ` (${x.ages})` : ""}`);
  else if (x.ages) morceaux.push(x.ages);
  if (x.ou) morceaux.push(/^(à|a|au|aux|en|dans|vers|près|pres|autour|entre|du côté|sur)\s/i.test(x.ou) ? x.ou : `à ${x.ou}`);
  if (x.quand) morceaux.push(x.quand);
  const transports = { train: "en train", voiture: "en voiture", velo: "à vélo", pied: "à pied" };
  if (transports[f.transport]) morceaux.push(transports[f.transport]);
  if (f.budget.max !== "" && f.budget.max !== null && f.budget.max !== undefined) morceaux.push(`budget ${nombre(f.budget.max)} ${f.budget.devise} ${f.budget.unite === "total" ? "pour le groupe" : "par personne"}${f.budget.transport_inclus ? ", transport compris" : ""}`);
  if (f.inclure.length) morceaux.push(`avec ${f.inclure.join(", ")}`);
  if (f.exclure.length) morceaux.push(`sans ${f.exclure.join(", ")}`);
  if (x.attendu) morceaux.push(`résultat attendu : ${x.attendu}`);
  return morceaux.length ? `${majuscule(morceaux.join(", "))}.` : "Aucun détail : ta demande suffit. Touche pour préciser le lieu, le budget, le transport…";
}

function champsRecherche(f) {
  return `${CHAMPS_FICHE.map(([cle, nom]) => `<input class="saisie" type="text" maxlength="120" data-champ="fiche.${cle}" value="${h(f.fiche[cle])}" aria-label="${nom}" placeholder="${nom}">`).join("")}
      <select class="saisie ${f.transport === "aucun" ? "grise" : ""}" data-champ="transport" aria-label="Transport">
        <option value="" ${f.transport ? "" : "selected"}>Transport : peu importe</option>
        ${Object.entries(S.d.listes.transports).map(([cle, nom]) => `<option value="${cle}" ${f.transport === cle ? "selected" : ""}>${h(cle === "aucun" ? "Pas de transport (sur place)" : nom.replace(/^\S+\s/, ""))}</option>`).join("")}
      </select>
      <div class="budget">
        <input class="saisie" type="number" min="0" step="1" inputmode="decimal" data-champ="budget.max" value="${h(f.budget.max)}" placeholder="Budget max" aria-label="Budget maximum">
        <select class="saisie" data-champ="budget.devise" aria-label="Devise">${S.d.listes.devises.map((x) => `<option ${f.budget.devise === x ? "selected" : ""}>${x}</option>`).join("")}</select>
        <select class="saisie" data-champ="budget.unite" aria-label="Budget par personne ou pour le groupe">
          <option value="personne" ${f.budget.unite === "personne" ? "selected" : ""}>par personne</option>
          <option value="total" ${f.budget.unite === "total" ? "selected" : ""}>pour le groupe</option></select>
      </div>
      ${interrupteur("Transport compris dans le budget", f.transport !== "aucun" && f.budget.transport_inclus, `data-bascule="budget.transport_inclus" ${f.transport === "aucun" ? "disabled" : ""}`).replace('class="interrupteur"', `class="interrupteur ${f.transport === "aucun" ? "grise" : ""}" style="padding:0"`)}
      ${bulles("inclure", f.inclure, "À inclure : piscine, musée…")}
      ${bulles("exclure", f.exclure, "À exclure : randonnée longue…")}`;
}

// Le nom d'un type de rubrique (modèle du catalogue « + ») ; sur mesure par défaut.
const nomModele = (id) => ((S.d.modeles || []).find((m) => m.id === id) || {}).titre || "Rubrique sur mesure";

function vueFiche() {
  const F = S.fiche, f = F.f, r = F.id ? S.d.regles.find((x) => x.id === F.id) : null;
  const ponctuelle = f.periode.type === "ponctuelle";
  // En haut de la fiche : le type de rubrique, le même nom que dans « Ajouter une rubrique ».
  const famille = ponctuelle ? (r ? "Recherche" : "Nouvelle recherche") : nomModele(f.modele);
  const segments = [["aucune", "Glissée"], ["phrase", "Une phrase"], ["courte", "Courte"], ["developpee", "Développée"]];
  const avant = r && r.place ? (S.d.deroule.find((x) => x.cle === r.place) || {}).nom : null;
  const point = ponctuelle && f.rendu === "point";
  const libelleBouton = F.id ? "Enregistrer" : ponctuelle ? "Créer et lancer" : "Ajouter à mon épisode";
  return `
  <div class="entete-fiche">
    <button type="button" class="icone" data-action="retour" aria-label="Retour">${icone("retour", 22, 2)}</button>
    <span class="surtitre">${h(famille)}</span>
    ${r ? `<button type="button" class="icone" data-action="plus" aria-label="Plus d'options">${icone("plusieurs", 22, 2)}</button>` : ""}
  </div>
  ${r && r.prochain && r.etat !== "active" && !ponctuelle ? `<p class="aide">Prochain passage : ${h(r.prochain)}</p>` : ""}
  ${ponctuelle ? `<section class="section-fiche" aria-labelledby="s-rendu"><h2 id="s-rendu">Ce que tu reçois</h2>
    <div class="segments avec-icones" role="group" aria-labelledby="s-rendu" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <button type="button" data-rendu="point" aria-pressed="${point}">${icone("casque", 18)}En podcast</button>
      <button type="button" data-rendu="idees" aria-pressed="${!point}">${icone("actus", 18)}Par écrit</button>
    </div>
    ${point ? `<div class="champ"><span class="etiquette" id="e-minutes">Durée</span>
      <div class="segments" role="group" aria-labelledby="e-minutes" style="grid-template-columns:repeat(5,minmax(0,1fr))">
        ${MINUTES_RECHERCHE.map((n) => `<button type="button" data-minutes="${n}" aria-pressed="${Number(f.minutes) === n}" aria-label="${n} minutes">${n} min</button>`).join("")}</div></div>
    <p class="aide">Les animateurs répondent à ta demande dans un podcast, à partir des sources cochées : l'état des lieux d'un sujet, des idées de sortie… Il arrive dans « Recherches », sans toucher à ton épisode du matin.</p>`
    : `<div class="champ"><span class="etiquette" id="e-recherches">Nombre de recherches web</span>
      <div class="segments" role="group" aria-labelledby="e-recherches" style="grid-template-columns:repeat(5,minmax(0,1fr))">
        ${[1, 2, 3, 4, 5].map((n) => `<button type="button" data-recherches="${n}" aria-pressed="${Number(f.recherches) === n}" aria-label="${texteRecherches(n)}">${n}</button>`).join("")}</div></div>
    <p class="aide">Des résultats à lire, avec leurs liens (articles, lieux, idées…), à partir des sources cochées. Plus de recherches : plus de pistes et de résultats (chacune compte un crédit de recherche web).</p>`}
  </section>` : ""}
  <section class="section-fiche" aria-labelledby="s-quoi"><h2 id="s-quoi">${ponctuelle ? "Ta demande" : "Ce qu'elle raconte"}</h2>
    <div class="champ"><label for="c-titre">Titre${ponctuelle ? "" : " (aussi titre du chapitre)"}</label>
      <input id="c-titre" class="saisie titre" type="text" maxlength="50" data-champ="titre" value="${h(f.titre)}" placeholder="${ponctuelle ? "Ex. Retards CFF" : "Ex. Fête du prénom du jour"}"></div>
    <div class="champ"><label for="c-consigne">${ponctuelle ? "Ce que tu veux" : "Consigne aux animateurs"}</label>
      <textarea id="c-consigne" class="saisie" maxlength="400" rows="3" data-champ="consigne" placeholder="${ponctuelle ? "Ex. Où en sont les retards des CFF et pourquoi ; une sortie au calme samedi, en intérieur s'il pleut" : "Ce qu'ils doivent dire ou faire"}">${h(f.consigne)}</textarea></div>
    ${ponctuelle ? detailsRecherche(F, f) : F.recherche ? blocRecherche(f) : `<button type="button" class="bouton pointille" data-action="recherche">+ Détails pour une recherche (lieu, budget, transport…)</button>`}
  </section>
  ${ponctuelle ? "" : `<section class="section-fiche" aria-labelledby="s-quand"><h2 id="s-quand">Quand</h2>
    <select id="c-periode" class="saisie" data-champ="periode.type" aria-label="Quand elle passe">
      ${PERIODES_RUBRIQUE.map(([cle, nom]) => `<option value="${cle}" ${f.periode.type === cle ? "selected" : ""}>${nom}</option>`).join("")}
    </select>
    ${f.periode.type === "jours" ? `<div class="jours" role="group" aria-label="Jours de la semaine">
      ${S.d.listes.jours.map(([j, court, long]) => `<button type="button" data-jour="${j}" aria-pressed="${f.periode.jours.includes(j)}" aria-label="${long}">${court[0]}</button>`).join("")}</div>` : ""}
    ${f.periode.type === "jours" || f.periode.type === "dates" ? `<div class="deux">
      <div class="champ"><label for="c-debut">${f.periode.type === "dates" ? "À partir du" : "Du (facultatif)"}</label><input id="c-debut" class="saisie" type="date" data-champ="periode.debut" value="${h(f.periode.debut)}"></div>
      <div class="champ"><label for="c-fin">${f.periode.type === "dates" ? "Jusqu'au" : "Au (facultatif)"}</label><input id="c-fin" class="saisie" type="date" data-champ="periode.fin" value="${h(f.periode.fin)}"></div></div>
      ${f.periode.type === "dates" ? `<p class="aide">Pour une sortie datée, commence quelques jours avant : elle sera présentée chaque matin jusqu'au jour J.</p>` : ""}` : ""}
    ${f.condition ? `<div class="sous-bloc">
        <div class="entre"><span class="etiquette" style="font-size:13px;color:var(--doux)">Seulement si mon agenda contient…</span>
          <button type="button" class="lien" data-action="sans-condition">Retirer</button></div>
        <input class="saisie" type="text" maxlength="120" data-champ="condition.texte" value="${h(f.condition.texte)}" aria-label="Texte cherché dans l'agenda" placeholder="Ex. match, train, dentiste">
        <div class="deux"><select class="saisie" data-champ="condition.moment" aria-label="Quand en parler">
          ${MOMENTS.map(([cle, nom]) => `<option value="${cle}" ${f.condition.moment === cle ? "selected" : ""}>${nom}</option>`).join("")}</select>
          ${f.condition.moment === "jours_avant" ? `<input class="saisie" type="number" min="1" max="30" data-champ="condition.n" value="${h(f.condition.n || 1)}" aria-label="Nombre de jours avant">` : "<span></span>"}</div>
      </div>` : `<button type="button" class="bouton pointille" data-action="condition">+ Seulement si mon agenda contient…</button>`}
  </section>
  <section class="section-fiche" aria-labelledby="s-place"><h2 id="s-place">Longueur du passage</h2>
    <div class="segments" role="group" aria-labelledby="s-place" style="grid-template-columns:repeat(4,minmax(0,1fr))">
      ${segments.map(([cle, nom]) => `<button type="button" data-longueur="${cle}" aria-pressed="${f.longueur === cle}">${nom}</button>`).join("")}
    </div>
    <p class="aide">${f.longueur === "aucune" ? "Glissée : pas de moment à elle, les animateurs placent l'information là où c'est naturel."
      : `Un moment à elle, avec son chapitre${avant ? `, après « ${h(avant)} »` : ""}. L'ordre se change dans « Ton épisode ».`}</p>
  </section>`}
  ${blocOuCherche(F, f, r)}
  ${r && !ponctuelle ? blocResume(r.id) : ""}
  <div class="barre"><button type="button" class="bouton plein" data-action="enregistrer">${libelleBouton}</button></div>`;
}

// ───────────────────────── résumé d'une rubrique ─────────────────────────
// Ce que la rubrique a raconté dans les derniers épisodes (gardé par le bot), dans un onglet qu'on
// ouvre et ferme : « Faire un résumé » en haut, puis chaque passage (date et texte en gris, sources en orange).
function blocResume(id) {
  const ouvert = S.resumeOuvert === id;
  const R = S.rub && S.rub.id === id ? S.rub : null;
  const corps = !ouvert ? "" : !R ? `<p class="aide">Chargement…</p>`
    : !R.entrees.length ? `<p class="aide">Rien de gardé pour l'instant : l'onglet se remplit à partir du prochain épisode où elle passe.</p>`
    : `<button type="button" class="bouton gris" data-action="rub-resumer" data-id="${h(id)}">Faire un résumé</button>
    ${R.entrees.map((x) => `<div class="passage"><span class="date-passage">${h(dateLongue(x.date))}</span>
      <div class="transcription">${h(x.texte)}</div>
      ${x.sources.length ? `<div class="sources">${x.sources.map((src) => ligneSource(src.titre, src.url)).join("")}</div>` : ""}</div>`).join("")}`;
  return `<section class="section-fiche">${enteteRepli("Ce qu'elle a raconté", "", ouvert, `data-action="rub-ouvrir" data-id="${h(id)}"`)}${corps}</section>`;
}

// « Faire un résumé » : une recherche toute réglée sur l'historique de la rubrique s'ouvre ; on choisit
// en podcast (trois minutes, comme avant) ou par écrit, puis « Créer et lancer ».
function resumerRubrique(id) {
  const r = S.d.regles.find((x) => x.id === id);
  const nom = r ? r.titre : (S.d.deroule.find((x) => x.cle === id) || {}).nom || "la rubrique";
  ouvrirFiche(null, {
    id: "point",
    f: { titre: `Résumé de « ${nom.slice(0, 28)} »`,
         consigne: `Fais le point sur ce que « ${nom} » a raconté ces derniers jours : regroupe par thème plutôt que jour par jour, relève ce qui revient ou évolue, dis ce qui est encore d'actualité et ce qui est dépassé.` },
    sources: [`rubrique:${id}`], minutes: 3,
  });
}

// ─────────────────────────────── sources ────────────────────────────────
// Une source : catégorie (« meteo »), un flux (« flux:ab12cd34 »), un site (« site:… ») ou un
// seul agenda (« agenda:<id> » ; « agenda » = tous).
function infoSource(cle) {
  const s = S.d.reglages.sources;
  const [type, id] = cle.split(":");
  if (type === "flux" && id) {
    const f = s.flux.find((x) => x.cle === cle);
    return f ? { cle, nom: f.nom, ou: f.url.replace(/^https?:\/\/(www\.)?/, "").split("/")[0], flux: true } : { cle, nom: "Flux retiré", ou: "", retiree: true };
  }
  if (type === "site" && id) {
    const x = s.sites.find((y) => y.cle === cle);
    return x ? { cle, nom: x.nom, ou: `recherche web limitée à ${x.domaine}` } : { cle, nom: "Site retiré", ou: "", retiree: true };
  }
  if (type === "agenda" && id) {
    const a = S.d.reglages.agendas.find((y) => y.id === id);
    return a ? { cle, nom: a.nom, ou: "seulement cet agenda" } : { cle, nom: "Agenda retiré", ou: "", retiree: true };
  }
  if (type === "rubrique" && id) {
    const nom = nomRubriqueSource(id);
    return nom ? { cle, nom: `Historique : ${nom}`, ou: "ce qu'elle a raconté dans les derniers épisodes" } : { cle, nom: "Rubrique retirée", ou: "", retiree: true };
  }
  const c = s.categories.find((x) => x.cle === cle);
  if (cle === "agenda") return { ...(c || {}), cle, nom: "Tous mes agendas", ou: "tous tes agendas lus" };
  return c ? { ...c, retiree: c.coupee } : { cle, nom: cle, ou: "", retiree: true };
}
// Les rubriques dont l'historique peut servir de source : les tiennes (sauf les recherches) et les essentielles qui parlent.
const rubriquesAvecHistorique = () => [
  ...S.d.regles.filter((r) => r.periode.type !== "ponctuelle").map((r) => [r.id, r.titre]),
  ...Object.keys(INTEGREES).filter((cle) => !INTEGREES[cle].fixe).map((cle) => [cle, ((S.d.deroule || []).find((x) => x.cle === cle) || {}).nom || cle]),
];
const nomRubriqueSource = (id) => (rubriquesAvecHistorique().find(([cle]) => cle === id) || [])[1] || "";
// Les sources qu'une rubrique lira vraiment (sans celles retirées dans Réglages › Sources).
const sourcesActives = (liste) => liste.filter((cle) => !infoSource(cle).retiree);
const sourcesProposables = (liste) => sourcesActives(liste);

// Les outils d'un type, pour « Où elle cherche » : catégories (services, données), et chacun de
// ses flux, sites, agendas. « types » : ceux que le modèle de la rubrique propose (null : tous).
function groupesSources(types = null) {
  const s = S.d.reglages.sources;
  const garde = (t) => !types || types.includes(t);
  return [
    ["services", "Services", s.categories.filter((c) => c.type === "services" && !c.coupee && garde(c.cle)).map((c) => c.cle)],
    ["donnees", "Données du podcast", s.categories.filter((c) => c.type === "donnees" && !c.coupee && garde(c.cle)).map((c) => c.cle)],
    ["flux", "Tes flux", garde("flux") ? s.flux.map((x) => x.cle) : []],
    ["sites", "Tes sites", garde("sites") ? s.sites.map((x) => x.cle) : []],
    ["agendas", "Tes agendas", garde("agendas") ? ["agenda", ...S.d.reglages.agendas.map((a) => `agenda:${a.id}`)] : []],
    ["rubriques", "Historique d'une rubrique", garde("rubriques") ? rubriquesAvecHistorique().map(([id]) => `rubrique:${id}`) : []],
  ].filter(([, , cles]) => cles.length);
}

// Fiche d'une rubrique : où elle cherche, coché explicitement (au moins une source). Une rubrique
// d'un modèle (train, météo…) ne voit que les sources qui ont du sens pour elle ; une rubrique sur
// mesure les voit toutes, rangées en groupes qu'on ouvre un à un.
function blocOuCherche(F, f, r) {
  const types = (S.d.listes.sources_par_modele || {})[f.modele] || null;
  const groupes = groupesSources(types);
  const actives = sourcesActives(f.sources);
  const proposees = groupes.flatMap(([, , cles]) => cles);
  const horsListe = f.sources.filter((cle) => !proposees.includes(cle));
  const modele = !F.id && S.fiche.modeleNom && f.sources.length ? `Proposées par le modèle « ${h(S.fiche.modeleNom)} ». ` : "";
  const puce = (cle) => `<button type="button" data-source="${h(cle)}" aria-pressed="${f.sources.includes(cle)}">${h(infoSource(cle).nom)}</button>`;
  let choix;
  if (types) {
    choix = groupes.map(([, titre, cles]) => `<span class="groupe">${h(titre)}</span><div class="puces-choix" role="group" aria-label="${h(titre)}">${cles.map(puce).join("")}</div>`).join("");
  } else {
    // Sur mesure : ce qui est coché d'abord, puis un groupe ouvert à la fois.
    const ouvert = groupes.some(([k]) => k === S.groupeSources) ? S.groupeSources : null;
    choix = `${f.sources.length ? `<span class="groupe">Cochées</span><div class="puces-choix">${f.sources.filter((c) => proposees.includes(c)).map(puce).join("")}</div>` : ""}
      <span class="groupe">Ajouter une source</span>
      <div class="groupes-sources">${groupes.map(([k, titre, cles]) => { const n = cles.filter((c) => f.sources.includes(c)).length;
        return `<button type="button" data-groupe-sources="${k}" aria-expanded="${ouvert === k}"><span>${h(titre)}</span><span class="compte">${n ? `${n} cochée${n > 1 ? "s" : ""} · ` : ""}${cles.length} ${ouvert === k ? "▴" : "▾"}</span></button>
        ${ouvert === k ? `<div class="puces-choix" role="group" aria-label="${h(titre)}">${cles.map(puce).join("")}</div>` : ""}`; }).join("")}</div>`;
  }
  return `<section class="section-fiche" aria-labelledby="s-sources"><h2 id="s-sources">Où elle cherche</h2>
    ${actives.length ? "" : `<div class="alerte">Choisis au moins une source : c'est là que la rubrique trouvera son contenu.</div>`}
    ${choix}
    ${horsListe.length ? `<div class="puces-choix">${horsListe.map((cle) => `<button type="button" data-source="${h(cle)}" aria-pressed="true" class="grise" aria-label="${h(infoSource(cle).nom)} : touche pour la décocher">${h(infoSource(cle).nom)} (${infoSource(cle).retiree ? "retirée" : "hors modèle"})</button>`).join("")}</div>` : ""}
    ${actives.length ? `<div class="ou-cherche">${actives.map((cle) => { const i = infoSource(cle); return `<span><b>${h(i.nom)}</b> · ${h(i.ou)}</span>`; }).join("")}</div>` : ""}
    <p class="aide">${modele}Rien d'autre n'est lu : sans source, les animateurs n'ont que leurs connaissances. Les outils se gèrent et se testent dans Réglages › Sources.</p>
    ${types ? `<button type="button" class="lien" style="align-self:flex-start" data-action="sur-mesure">Une autre source ? En faire une rubrique sur mesure</button>` : ""}
  </section>`;
}

// Ce que lit une rubrique fournie : ses agendas (Agenda, Mes déplacements) ou ses flux (Actu
// locale, À creuser, Actualités globales), avec le raccourci vers Réglages › Sources.
const AIDES_SOURCES_FOURNIES = {
  agenda: "« Tous mes agendas » : ceux que le podcast lit. Choisis-en un ou plusieurs pour que l'agenda du matin ne parle que d'eux.",
  deplacements: "Les voyages et sorties sont repérés dans ces agendas. « Tous mes agendas » : ceux que le podcast lit.",
  actu_locale: "En plus de Google Actualités sur ta ville (et tes thèmes), les flux cochés : un média local, par exemple.",
  approfondissements: "En plus de Google Actualités et de la recherche web, les articles des flux cochés qui parlent des sujets à creuser.",
  actualites: "Les flux cochés, plus une recherche Google Actualités par thème préféré (trois au plus).",
};
function blocSourcesFournie(cle) {
  const type = (S.d.listes.sources_integrees || {})[cle];
  if (!type) return "";
  const r = S.d.reglages, s = r.sources;
  let puces;
  if (type === "agendas") {
    const choisis = (r.sources_integrees || {})[cle] || ["agenda"];
    puces = [["agenda", "Tous mes agendas"], ...r.agendas.map((a) => [`agenda:${a.id}`, a.nom])]
      .map(([v, nom]) => `<button type="button" data-source-fournie="${cle}" data-valeur="${h(v)}" aria-pressed="${choisis.includes(v)}">${h(nom)}</button>`).join("");
  } else {
    const choisis = cle === "actualites" ? s.flux.filter((f) => f.actualites).map((f) => f.cle) : (r.sources_integrees || {})[cle] || [];
    puces = s.flux.map((f) => `<button type="button" data-source-fournie="${cle}" data-valeur="${h(f.cle)}" aria-pressed="${choisis.includes(f.cle)}">${h(f.nom)}</button>`).join("")
      || `<p class="aide">Aucun flux pour l'instant.</p>`;
  }
  return `<section class="section-fiche" aria-labelledby="s-src-${cle}"><h2 id="s-src-${cle}">Où elle cherche</h2>
    <div class="puces-choix" role="group" aria-labelledby="s-src-${cle}">${puces}</div>
    <p class="aide">${h(AIDES_SOURCES_FOURNIES[cle] || "")}</p>
    <button type="button" class="bouton gris" data-reglage="sources" data-onglet="${type}">${type === "agendas" ? "Configurer mes agendas" : "Ajouter ou tester un flux"}</button>
  </section>`;
}

// Réglages › Sources : tous les outils, rangés par type. Chacun se règle, se teste et dit
// quelles rubriques s'en servent ; Gemini, le moteur, a son écran à lui.
function utilisePar(x) {
  const noms = x.rubriques.map((r) => r.titre);
  if (x.aussi) noms.push(x.aussi);
  return noms.length ? noms.join(" · ") : "aucune rubrique pour l'instant";
}

// Dernier test d'un outil (service, flux, site, agenda) : ce qu'il a appris et quand.
function resultatTest(t) {
  if (!t) return "";
  if (t.en_cours) return `<p class="test-cle" role="status">⏳ Le service refuse les questions du bot : test en cours depuis GitHub, résultat dans une minute environ.</p>`;
  const quand = t.quand ? ` <span style="opacity:.75">· ${h(dateLongue(t.quand.slice(0, 10)))} à ${h(t.quand.slice(11, 16))}</span>` : "";
  return `<p class="test-cle ${t.ok ? "ok" : "ko"}" role="status">${t.ok ? "✓" : "✗"} ${h(t.message)}${quand}</p>`;
}
const boutonTester = (cle, texte = "Tester") => `<button type="button" class="bouton gris" data-tester-outil="${h(cle)}">${texte}</button>`;

const ONGLETS_SOURCES = [["services", "Services"], ["flux", "Flux"], ["sites", "Sites"], ["agendas", "Agendas"], ["donnees", "Données"]];

function vueSources() {
  const onglet = ONGLETS_SOURCES.some(([k]) => k === S.ongletSources) ? S.ongletSources : "services";
  const corps = { services: ongletServices, flux: ongletFlux, sites: ongletSites, agendas: ongletAgendas, donnees: ongletDonnees }[onglet];
  return `<div class="segments" role="tablist" aria-label="Types d'outils" style="grid-template-columns:repeat(5,minmax(0,1fr));position:sticky;top:0;z-index:2">
      ${ONGLETS_SOURCES.map(([k, nom]) => `<button type="button" role="tab" style="font-size:13px" data-onglet-sources="${k}" aria-pressed="${onglet === k}" aria-selected="${onglet === k}">${nom}</button>`).join("")}
    </div>
    ${corps()}`;
}

}

// Liste en bulles : chaque élément est une bulle ; Entrée ou virgule ajoute la saisie.
function bulles(champ, valeurs, exemple) {
  return `<div class="bulles" data-bulles="${champ}">
    ${valeurs.map((v, i) => `<span>${h(v)}<button type="button" data-retirer-bulle="${champ}" data-i="${i}" aria-label="Retirer ${h(v)}">${icone("croix", 14, 2)}</button></span>`).join("")}
    <input type="text" maxlength="80" data-bulle="${champ}" placeholder="${h(exemple)}" aria-label="${h(exemple)}" enterkeyhint="done">
  </div>`;
}

function ajouterBulle(el) {
  const morceaux = el.value.split(",").map((x) => x.trim()).filter(Boolean);
  if (!morceaux.length || !S.fiche) return false;
  const liste = S.fiche.f[el.dataset.bulle];
  for (const m of morceaux) if (!liste.some((x) => x.toLowerCase() === m.toLowerCase()) && liste.length < 8) liste.push(m);
  S.fiche.modifie = true;
  el.value = "";
  dessiner();
  const nouveau = document.querySelector(`[data-bulle="${el.dataset.bulle}"]`);
  if (nouveau) nouveau.focus();
  return true;
}

function saisirChamp(el) {
  const f = S.fiche.f, [a, b] = el.dataset.champ.split(".");
  const valeur = el.type === "number" && a !== "budget" ? Number(el.value) : el.value;
  if (b) f[a][b] = valeur; else f[a] = valeur;
  S.fiche.modifie = true;
  // Horaires de train : seulement si « Trains » est coché, ce qui se voit dans « Où elle cherche ».
  if (a === "transport" && valeur === "train" && !f.sources.includes("transports") && !infoSource("transports").retiree) {
    f.sources.push("transports");
    annoncer("« Trains » ajouté à Où elle cherche, pour les horaires.");
  }
  if (el.tagName === "SELECT") dessiner();
}

async function enregistrerFiche() {
  const F = S.fiche;
  // Une saisie en cours dans les bulles compte aussi.
  document.querySelectorAll("[data-bulle]").forEach((el) => { if (el.value.trim()) { const l = F.f[el.dataset.bulle]; el.value.split(",").map((x) => x.trim()).filter(Boolean).forEach((m) => { if (!l.includes(m)) l.push(m); }); } });
  const nouvelleRecherche = !F.id && F.f.periode.type === "ponctuelle";
  if (!sourcesActives(F.f.sources).length) {
    annoncer("Choisis au moins une source dans « Où elle cherche ».", true);
    const bloc = document.getElementById("s-sources");
    if (bloc) bloc.scrollIntoView({ behavior: "smooth", block: "center" });
    return;
  }
  const bouton = document.querySelector('[data-action="enregistrer"]');
  if (bouton) bouton.disabled = true;
  const j = await demander("rubrique", { id: F.id, formulaire: F.f });
  if (bouton) bouton.disabled = false;
  if (!j.ok) return;
  vibrer("success");
  const depuisConsigne = F.depuisConsigne;
  S.fiche = null;
  if (depuisConsigne !== undefined && depuisConsigne !== null) {
    // La consigne devenue rubrique n'a plus lieu d'être.
    const l = listeActuelle("consignes");
    l.splice(Number(depuisConsigne), 1);
    await demander("liste", { chemin: "consignes", valeurs: l }, { discret: true });
  }
  if (nouvelleRecherche) {
    const k = await demander("recherche", { id: j.id });
    annoncer(k.ok ? k.message : "Recherche créée");
    S.recherche = j.id; S.ecran = "resultats";
    dessiner();
    return window.scrollTo(0, 0);
  }
  annoncer(j.message);
  const r = S.d.regles.find((x) => x.id === j.id);
  if (r && r.periode.type === "ponctuelle") { S.recherche = r.id; S.ecran = "resultats"; } else S.ecran = "programme";
  dessiner();
  window.scrollTo(0, 0);
}

function menuFiche() {
  const F = S.fiche;
  const r = S.d.regles.find((x) => x.id === F.id);
  // Une recherche ponctuelle se relance depuis sa page de résultats ; ici : l'ajouter aux épisodes, ou la supprimer.
  const boutons = r && r.periode.type === "ponctuelle"
    ? [{ id: "garder", type: "default", text: "Mettre dans mes épisodes" }, { id: "supprimer", type: "destructive", text: "Supprimer" }]
    : r && r.recherche
    ? [{ id: "chercher", type: "default", text: "Chercher maintenant" }, { id: "mini", type: "default", text: "Mini-podcast" }, { id: "supprimer", type: "destructive", text: "Supprimer" }]
    : [{ id: "tester", type: "default", text: "Épisode test avec elle" }, { id: "supprimer", type: "destructive", text: "Supprimer" }];
  choisir(F.f.titre || ("Rubrique " + F.id), "Que veux-tu faire ?", boutons, (choix) => {
    if (choix === "garder") return garderDansEpisodes();
    if (choix === "chercher" || choix === "mini") return chercher(F.id, choix === "mini" ? "audio" : "ecrit");
    if (choix === "tester") return confirmer("Lancer maintenant un épisode qui inclut cette rubrique ?", () => changer("generer", { id: F.id }, () => {}));
    if (choix === "supprimer") return confirmer(`Supprimer « ${F.f.titre} » ?`, async () => {
      const j = await demander("supprimer", { id: F.id });
      if (!j.ok) return;
      vibrer("success"); annoncer("Rubrique supprimée");
      const origine = ["idees", "resultats"].includes(F.origine) ? "idees" : "programme";
      S.fiche = null; S.recherche = null; S.ecran = origine; dessiner();
    });
  });
}

// Menu « ··· » d'une rubrique essentielle : chercher tout de suite, mini-podcast, ou la retirer des épisodes
// (elle reste dans « Ajouter une rubrique » › L'essentiel, avec son interrupteur).
function menuIntegree() {
  const cle = S.integree, x = S.d.deroule.find((y) => y.cle === cle);
  if (!x || !INTEGREES[cle] || INTEGREES[cle].fixe) return;
  const boutons = [{ id: "chercher", type: "default", text: "Chercher maintenant" }, { id: "mini", type: "default", text: "Mini-podcast" },
    { id: "supprimer", type: "destructive", text: "Supprimer" }];
  choisir(x.nom, "Que veux-tu faire ?", boutons, (choix) => {
    if (choix === "chercher" || choix === "mini") return chercher(cle, choix === "mini" ? "audio" : "ecrit");
    if (choix === "supprimer") return confirmer(`Retirer « ${x.nom} » de tes épisodes ? Tu pourras la remettre depuis « Ajouter une rubrique » › L'essentiel.`, async () => {
      const j = await demander("deroule", { ordre: S.d.deroule.map((y) => y.cle), actifs: { [cle]: false } });
      if (!j.ok) return;
      vibrer("success"); annoncer(`${x.nom} retirée de tes épisodes`);
      S.ecran = "programme"; dessiner(); window.scrollTo(0, 0);
    });
  });
}

// Une recherche devient une rubrique de l'épisode : on choisit quand elle passe, puis on enregistre.
function garderDansEpisodes() {
  const f = S.fiche.f;
  f.periode = { type: "toujours", debut: "", fin: "", jours: [] };
  f.longueur = "courte";
  S.fiche.origine = "programme";
  S.fiche.modifie = true;
  annoncer("Choisis quand elle passe, puis enregistre.");
  dessiner();
  window.scrollTo(0, 0);
}

async function chercher(id, format) {
  const j = await demander("recherche", { id, format });
  if (j.ok) { vibrer("success"); annoncer(j.message); }
}
