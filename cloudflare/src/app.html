function ordreAffiche() { return [...document.querySelectorAll("#deroule li")].map((li) => li.dataset.cle); }
function renumeroter() { document.querySelectorAll("#deroule li .num").forEach((el, i) => { el.textContent = i + 1; }); }

let envoiDeroule = null;
function enregistrerDeroule(actifs) {
  clearTimeout(envoiDeroule);
  envoiDeroule = setTimeout(async () => {
    const avant = S.d.deroule.map((x) => x.cle).join(",");
    const ordre = ordreAffiche();
    if (!actifs && ordre.join(",") === avant) return;
    const j = await demander("deroule", { ordre, actifs: actifs || {} });
    if (j.ok) { vibrer("success"); annoncer("Déroulé enregistré"); }
    if (S.ecran === "programme") dessiner();
  }, actifs ? 0 : 350);
}

function brancherGlisser() {
  const liste = document.getElementById("deroule");
  if (!liste) return;
  liste.querySelectorAll("[data-poignee]").forEach((poignee) => {
    const li = poignee.closest("li");
    poignee.addEventListener("keydown", (ev) => {
      if (ev.key !== "ArrowUp" && ev.key !== "ArrowDown") return;
      ev.preventDefault();
      const voisin = ev.key === "ArrowUp" ? li.previousElementSibling : li.nextElementSibling;
      if (!voisin || !voisin.classList.contains("mobile")) return;
      if (ev.key === "ArrowUp") liste.insertBefore(li, voisin); else liste.insertBefore(voisin, li);
      renumeroter(); poignee.focus(); enregistrerDeroule();
    });
    poignee.addEventListener("pointerdown", (ev) => {
      if (ev.button !== undefined && ev.button !== 0) return;
      ev.preventDefault();
      poignee.setPointerCapture(ev.pointerId);
      const departY = ev.clientY, departHaut = li.offsetTop;
      li.classList.add("glisse");
      vibrer("choix");
      const bouger = (e) => {
        const mobiles = [...liste.querySelectorAll("li.mobile")];
        const haut = mobiles[0].offsetTop, bas = mobiles[mobiles.length - 1].offsetTop + mobiles[mobiles.length - 1].offsetHeight - li.offsetHeight;
        const voulu = Math.max(haut, Math.min(bas, departHaut + (e.clientY - departY)));
        const milieu = voulu + li.offsetHeight / 2;
        for (let cran = 0; cran < 20; cran++) {
          const avant = li.previousElementSibling, apres = li.nextElementSibling;
          if (avant && avant.classList.contains("mobile") && milieu < avant.offsetTop + avant.offsetHeight / 2) liste.insertBefore(li, avant);
          else if (apres && apres.classList.contains("mobile") && milieu > apres.offsetTop + apres.offsetHeight / 2) liste.insertBefore(apres, li);
          else break;
          vibrer("choix"); renumeroter();
        }
        li.style.transform = `translateY(${voulu - li.offsetTop}px)`;
      };
      const finir = () => {
        poignee.removeEventListener("pointermove", bouger);
        poignee.removeEventListener("pointerup", finir);
        poignee.removeEventListener("pointercancel", finir);
        li.classList.remove("glisse");
        li.style.transform = "";
        enregistrerDeroule();
      };
      poignee.addEventListener("pointermove", bouger);
      poignee.addEventListener("pointerup", finir);
      poignee.addEventListener("pointercancel", finir);
    });
  });
}

// ─────────────────────────────── planning ───────────────────────────────
// Un jour du calendrier. Le bot n'envoie que les jours qui sortent de l'habitude :
// les autres ont l'heure habituelle de leur jour de la semaine.
function jourCalendrier(date) {
  const pl = S.d.planning;
  return pl.calendrier[date] || { heure: pl.jours[CLES_JOURS[dateObj(date).getUTCDay()]] || null };
}
// Nombre de mois qu'on peut feuilleter après le mois en cours.
function moisPlanningMax() {
  const d = S.d, fin = d.planning.calendrier_jusqua;
  if (!fin) return 1;                       // bot d'avant : le mois en cours et le suivant
  return (Number(fin.slice(0, 4)) - Number(d.aujourdhui.slice(0, 4))) * 12 + Number(fin.slice(5, 7)) - Number(d.aujourdhui.slice(5, 7));
}

function vuePlanning() {
  const d = S.d, pl = d.planning;
  const premier = `${d.aujourdhui.slice(0, 8)}01`;
  const maxMois = moisPlanningMax();
  S.mois = Math.max(0, Math.min(maxMois, S.mois || 0));
  const mois = (() => { const x = dateObj(premier); x.setUTCMonth(x.getUTCMonth() + S.mois); return x.toISOString().slice(0, 10); })();
  const m = dateObj(mois);
  const decalage = (m.getUTCDay() + 6) % 7;
  const jours = [];
  for (let i = 0; i < 31; i++) { const date = plusJours(mois, i); if (date.slice(5, 7) !== mois.slice(5, 7)) break; jours.push(date); }
  const normal = (date) => pl.jours[CLES_JOURS[dateObj(date).getUTCDay()]];
  const cellule = (date) => {
    const c = jourCalendrier(date);
    const classes = [];
    if (date < d.aujourdhui) classes.push("passe");
    if (date === d.aujourdhui) classes.push("aujourdhui");
    if (c.pause) {
      // Bande continue sur les jours de la pause, arrondie à ses bouts et en fin de semaine.
      const enPause = (x) => jourCalendrier(x).pause;
      const col = (dateObj(date).getUTCDay() + 6) % 7;
      classes.push("pause");
      if (col === 0 || !enPause(plusJours(date, -1)) || date.slice(8) === "01") classes.push("debut");
      if (col === 6 || !enPause(plusJours(date, 1)) || plusJours(date, 1).slice(8) === "01") classes.push("fin");
    } else if (c.exception && !c.heure) classes.push("saute");
    else if (!c.heure) classes.push("sans");
    else if (c.exception || c.heure !== normal(date)) classes.push("autre");
    if (c.ferie) classes.push("ferie");
    const etiquette = `${dateLongue(date)} : ${c.heure ? `épisode à ${heure(c.heure)}` : "pas d'épisode"}${c.ferie ? ", férié" : ""}`;
    return `<button type="button" class="${classes.join(" ")}" data-jourcal="${date}" aria-label="${h(etiquette)}">${Number(date.slice(8))}</button>`;
  };
  const regions = [...d.listes.regions].sort((a, b) => a[1].localeCompare(b[1], "fr", { sensitivity: "base" }));
  return `
  <h1>Planning</h1>
  <section class="carte" aria-labelledby="t-mois">
    <div class="entre"><div style="display:flex;flex-direction:column;align-items:flex-start;min-width:0">
        <h2 id="t-mois">${majuscule(MOIS[m.getUTCMonth()])} ${m.getUTCFullYear()}</h2>
        ${S.mois > 1 ? `<button type="button" class="lien" style="min-height:32px;padding:0;font-size:13px" data-mois="0">Revenir à aujourd'hui</button>` : ""}</div>
      <div class="ligne" style="gap:4px">
        <button type="button" class="icone" style="background:var(--carte-2);width:40px;height:40px" data-mois="${S.mois - 1}" ${S.mois === 0 ? "disabled" : ""} aria-label="Mois précédent">${icone("retour", 16, 2.2)}</button>
        <button type="button" class="icone" style="background:var(--carte-2);width:40px;height:40px" data-mois="${S.mois + 1}" ${S.mois >= maxMois ? "disabled" : ""} aria-label="Mois suivant">${icone("suite", 16, 2.2)}</button>
      </div></div>
    <div class="calendrier">
      ${["L", "M", "M", "J", "V", "S", "D"].map((x) => `<span class="tete" aria-hidden="true">${x}</span>`).join("")}
      ${"<span></span>".repeat(decalage)}${jours.map(cellule).join("")}
    </div>
    <div class="legende"><span><i style="background:var(--aube);border-radius:50%"></i>Autre heure</span>
      <span><i style="background:var(--vert);border-radius:50%"></i>Férié</span><span><s>12</s>&nbsp;Sauté</span><span><i style="width:22px;height:10px;border-radius:5px;background:var(--carte-2);background-image:linear-gradient(var(--doux),var(--doux));background-size:100% 2px;background-position:center;background-repeat:no-repeat"></i>Plusieurs jours</span></div>
    <p class="aide">Touche un jour pour changer son heure ou ne pas avoir d'épisode (un ou plusieurs jours).</p>
  </section>
  <section class="bloc" aria-label="Heure de chaque jour">
    ${d.listes.jours.map(([j, , long]) => `<div class="reglage"><span>${majuscule(long)}</span>
      ${pl.jours[j] ? `<input type="time" class="compacte" value="${h(pl.jours[j])}" data-heure-jour="${j}" aria-label="Heure du ${long}">` : `<span class="sous">Pas d'épisode</span>`}
      <button type="button" class="mini-inter" role="switch" aria-checked="${Boolean(pl.jours[j])}" data-jour-actif="${j}" aria-label="Épisode le ${long}"><span class="rail"><span></span></span></button></div>`).join("")}
  </section>
  <section class="bloc">
    <div class="reglage"><span>Jours fériés de</span>
      <select class="compacte" style="max-width:190px" data-region aria-label="Pays ou canton des jours fériés">
        ${regions.map(([c, n]) => `<option value="${c}" ${pl.feries_region === c ? "selected" : ""}>${h(n)}</option>`).join("")}</select></div>
    <div class="reglage"><span>Un jour férié</span>
      <select class="compacte" data-regler="planning.feries" aria-label="Jours fériés">
        ${[["normal", "comme d'habitude"], ["dimanche", "heure du dimanche"], ["aucun", "pas d'épisode"]].map(([v, n]) => `<option value="${v}" ${pl.feries === v ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    ${interrupteur("Relancer si l'épisode n'est pas arrivé", pl.rattrapage, 'data-regler-bool="planning.rattrapage"')}
    ${pl.rattrapage ? `<div class="reglage"><span>Relancer après</span><select class="compacte" data-regler="planning.delai_rattrapage" aria-label="Délai du rattrapage">
      ${d.listes.delais.map((v) => `<option value="${v}" ${Number(pl.delai_rattrapage) === v ? "selected" : ""}>${v} min</option>`).join("")}</select></div>` : ""}
    <div class="reglage"><span>Préparation en avance<br><span class="aide">pour que l'épisode arrive à l'heure</span></span><select class="compacte" data-regler="planning.avance_minutes" aria-label="Préparation en avance">
      ${[0, 5, 10, 15, 20].map((v) => `<option value="${v}" ${Number(pl.avance_minutes) === v ? "selected" : ""}>${v} min</option>`).join("")}</select></div>

// Aperçu de l'agenda : les 7 prochains jours, tous agendas lus confondus.
function vueAgenda() {
  const d = S.d, evs = d.agenda_apercu || [];
  const agendas = d.reglages.agendas.map((a) => a.id);
  const couleurs = ["var(--aube)", "var(--bleu)", "var(--vert)", "#E8A0D8", "#C3C9D4"];
  const jours = Array.from({ length: 7 }, (_, i) => plusJours(d.aujourdhui, i));
  const parJour = jours.map((date) => [date, evs.filter((ev) => ev.debut.slice(0, 10) === date || (ev.journee && ev.debut.slice(0, 10) < date && (ev.fin || "").slice(0, 10) > date))]);
  const nom = (date, i) => i === 0 ? "Aujourd'hui" : i === 1 ? "Demain" : majuscule(dateLongue(date));
  return `<section class="carte" aria-labelledby="t-agenda">
    <div class="entre"><h2 id="t-agenda">Mon agenda</h2><button type="button" class="lien" style="min-height:32px;padding:0" data-action="lire-agendas">Relire</button></div>
    ${evs.length ? `<div class="agenda">${parJour.filter(([, l]) => l.length).map(([date, l]) => `<div class="agenda-jour">
        <span class="agenda-date">${h(nom(date, jours.indexOf(date)))}</span>
        ${l.map((ev) => `<div class="agenda-ev"><i style="background:${couleurs[Math.max(0, agendas.indexOf(ev.agenda)) % couleurs.length]}"></i>
          <span class="agenda-h">${ev.journee ? "Journée" : h(ev.debut.slice(11, 16).replace(":", "h"))}</span>
          <span class="agenda-t">${h(ev.titre)}${ev.lieu ? `<br><span class="aide">${h(ev.lieu)}</span>` : ""}</span></div>`).join("")}
      </div>`).join("") || `<p class="aide">Rien dans les 7 prochains jours.</p>`}</div>
      ${d.agenda_lu ? `<p class="aide">Lu le ${h(dateLongue(d.agenda_lu.slice(0, 10)))} à ${h(d.agenda_lu.slice(11, 16).replace(":", "h"))}.</p>` : ""}`
    : `<p class="aide">L'aperçu apparaîtra après la prochaine lecture de tes agendas (chaque matin, ou avec « Relire »).</p>`}
  </section>`;
}

// Tant qu'une feuille est ouverte, la page derrière ne défile pas.
new MutationObserver(() => document.body.classList.toggle("feuille-ouverte", !document.getElementById("feuille").classList.contains("cache")))
  .observe(document.getElementById("feuille"), { attributes: true, attributeFilter: ["class"] });
// iPhone : seul un contenu qui défile vraiment reçoit le glissé ; le reste ne fait pas bouger la page.
document.getElementById("feuille").addEventListener("touchmove", (ev) => {
  const zone = ev.target.closest(".defile, .panneau");
  if (!zone || zone.scrollHeight <= zone.clientHeight) ev.preventDefault();
}, { passive: false });

// ───────────────────────────── listes de choix ─────────────────────────────
// Les <select> restent dans la page (valeur, accessibilité au clavier), mais un
// appui ouvre une feuille de l'application au lieu du sélecteur du téléphone.
function ouvrirListe(sel) {
  if (sel.disabled) return;
  const el = document.getElementById("feuille");
  const etiquette = sel.getAttribute("aria-label") || (sel.id && document.querySelector(`label[for="${sel.id}"]`)?.textContent)
    || sel.closest(".reglage")?.querySelector("span")?.textContent || "Choisir";
  const ligne = (o) => `<button type="button" role="option" aria-selected="${o.selected}" data-liste-valeur="${h(o.value)}" ${o.disabled ? "disabled" : ""}>
    <span>${h(o.textContent)}</span>${o.selected ? icone("coche", 18, 2.4) : ""}</button>`;
  const contenu = [...sel.children].map((x) => x.tagName === "OPTGROUP"
    ? `<span class="groupe">${h(x.label)}</span>${[...x.children].map(ligne).join("")}` : ligne(x)).join("");
  el.innerHTML = `<div class="panneau">
    <div class="entete"><strong id="feuille-titre">${h(String(etiquette).trim())}</strong></div>
    <div class="choix liste-choix defile" role="listbox" aria-labelledby="feuille-titre">${contenu}</div>
    <button type="button" class="annuler" data-liste-valeur="" data-liste-fermer>Annuler</button></div>`;
  el.classList.remove("cache");
  const fermer = () => { el.classList.add("cache"); el.innerHTML = ""; el.onclick = null; document.removeEventListener("keydown", echap); sel.focus({ preventScroll: true }); };
  const echap = (ev) => { if (ev.key === "Escape") fermer(); };
  document.addEventListener("keydown", echap);
  el.onclick = (ev) => {
    ev.stopPropagation();
    const b = ev.target.closest("[data-liste-valeur]");
    if (!b && ev.target !== el) return;
    fermer();
    if (!b || b.dataset.listeFermer !== undefined || b.dataset.listeValeur === sel.value) return;
    sel.value = b.dataset.listeValeur;
    vibrer("choix");
    sel.dispatchEvent(new Event("change", { bubbles: true }));
  };
  const choisie = el.querySelector('[aria-selected="true"]') || el.querySelector("[data-liste-valeur]");
  if (choisie) { choisie.scrollIntoView({ block: "center" }); choisie.focus({ preventScroll: true }); }
}

// Un appui (sans glisser) sur une liste l'ouvre ; le <select> ne reçoit pas le toucher.
let appui = null;
document.addEventListener("pointerdown", (ev) => { appui = { x: ev.clientX, y: ev.clientY }; }, true);
document.addEventListener("pointerup", (ev) => {
  if (!appui || Math.hypot(ev.clientX - appui.x, ev.clientY - appui.y) > 10) return;
  appui = null;
  if (!document.getElementById("feuille").classList.contains("cache")) return;
  const sel = [...document.querySelectorAll("main select")].find((x) => {
    const r = x.getBoundingClientRect();
    return !x.disabled && r.width && ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
  });
  if (!sel) return;
  ev.preventDefault();
  // Le clic qui suit l'appui tomberait sur le fond de la feuille et la refermerait.
  const avaler = (e) => { e.stopPropagation(); e.preventDefault(); };
  document.addEventListener("click", avaler, { capture: true, once: true });
  setTimeout(() => document.removeEventListener("click", avaler, true), 600);
  ouvrirListe(sel);
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "SELECT" && [" ", "Enter", "ArrowDown", "ArrowUp"].includes(ev.key) && !ev.altKey) { ev.preventDefault(); ouvrirListe(ev.target); }
});

// Toucher un jour du calendrier : changer son heure, ou pas d'épisode pendant N jours.
const J = { date: "", heure: "", nb: 1 };
function toucherJour(date) {
  const d = S.d, pl = d.planning, c = jourCalendrier(date);
  if (date < d.aujourdhui) return;
  const habituelle = pl.jours[CLES_JOURS[dateObj(date).getUTCDay()]] || "";
  if (J.date !== date) Object.assign(J, { date, heure: c.heure || habituelle || "07:30", nb: 1 });
  const pause = pl.pauses.find((x) => date >= x.du && date <= x.au);
  const exception = pl.exceptions.find((x) => x.date === date);
  const etat = pause ? `Pas d'épisode : pause du ${dateLongue(pause.du)} au ${dateLongue(pause.au)}.`
    : c.heure ? `Épisode à ${heure(c.heure)}${exception ? " (heure changée pour ce jour)" : ""}.`
    : exception ? "Pas d'épisode ce jour-là." : "Pas d'épisode prévu ce jour-là.";
  const fin = plusJours(date, J.nb - 1);
  const el = document.getElementById("feuille");
  const fermer = () => { el.classList.add("cache"); el.innerHTML = ""; el.onclick = el.oninput = null; J.date = ""; };
  el.innerHTML = `<div class="panneau">
    <div class="entete"><strong id="feuille-titre">${h(majuscule(dateLongue(date)))}</strong>
      <span>${h(etat)}${c.ferie ? ` Férié${c.ferie_nom ? ` : ${h(c.ferie_nom)}` : ""}.` : ""}</span></div>
    ${pause ? `<button type="button" class="annuler" style="background:var(--carte)" data-jour-faire="retirer-pause">Retirer cette pause</button>` : `
    <div class="bloc-jour">
      <div class="entre"><label for="j-heure" style="font-weight:600">Heure de l'épisode</label>
        <input id="j-heure" type="time" class="compacte" value="${h(J.heure)}" data-jour-heure></div>
      <button type="button" class="bouton gris" data-jour-faire="heure">${c.heure ? "Changer l'heure ce jour-là" : "Avoir un épisode ce jour-là"}</button>
    </div>
    <div class="bloc-jour">
      <div class="entre"><span style="font-weight:600">Pas d'épisode pendant</span>
        <div class="pas"><button type="button" data-jour-nb="-1" ${J.nb <= 1 ? "disabled" : ""} aria-label="Un jour de moins">−</button>
          <output aria-live="polite">${J.nb} jour${J.nb > 1 ? "s" : ""}</output>
          <button type="button" data-jour-nb="1" ${J.nb >= 60 ? "disabled" : ""} aria-label="Un jour de plus">+</button></div></div>
      <span class="aide">${J.nb > 1 ? `Du ${h(dateLongue(date))} au ${h(dateLongue(fin))}` : `Seulement le ${h(dateLongue(date))}`}</span>
      <button type="button" class="bouton gris" style="color:var(--rouge)" data-jour-faire="sans">Pas d'épisode</button>
    </div>
    ${exception ? `<button type="button" class="annuler" style="background:var(--carte)" data-jour-faire="retablir">Revenir à l'horaire habituel</button>` : ""}`}
    <button type="button" class="annuler" data-jour-faire="fermer">Fermer</button></div>`;
  el.classList.remove("cache");
  el.oninput = (ev) => { if (ev.target.dataset.jourHeure !== undefined) J.heure = ev.target.value; };
  el.onclick = (ev) => {
    ev.stopPropagation();
    const b = ev.target.closest("button");
    if (!b && ev.target === el) return fermer();
    if (!b || b.disabled) return;
    if (b.dataset.jourNb) { J.nb = Math.max(1, Math.min(60, J.nb + Number(b.dataset.jourNb))); vibrer("choix"); return toucherJour(date); }
    const faire = b.dataset.jourFaire;
    if (!faire) return;
    const nb = J.nb, h0 = J.heure;
    fermer();
    if (faire === "heure") {
      if (!h0) return annoncer("Choisis une heure.", true);
      return h0 === habituelle && exception ? changer("retablir", { date }) : changer("exception", { date, heure: h0 });
    }
    if (faire === "sans") return nb > 1 ? changer("pause", { du: date, au: plusJours(date, nb - 1) }) : changer("exception", { date, heure: null });
    if (faire === "retablir") return changer("retablir", { date });
    if (faire === "retirer-pause") return changer("retirer_pause", { du: pause.du });
  };
  const premier = el.querySelector("[data-jour-heure], [data-jour-faire]");
  if (premier && !el.contains(document.activeElement)) premier.focus();
}

        ${d.maj_etat && d.maj_etat.etat === "erreur" ? `<p class="aide" style="color:var(--rouge)">La mise à jour n'a pas abouti : ${h(d.maj_etat.message)}</p>` : ""}
        ${d.maj_etat && d.maj_etat.etat === "fait" && d.maj_etat.message ? `<p class="aide">Dernière mise à jour : ${h(d.maj_etat.message)}</p>` : ""}
        ${d.maj ? `<div class="sous-bloc" style="background:var(--carte-2)"><strong>${h(d.maj.titre || "Nouvelle version")} · ${h(d.maj.version)}</strong>
            ${d.maj.nouveautes.length ? `<ul style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.4">${d.maj.nouveautes.map((n) => `<li>${h(n)}</li>`).join("")}</ul>` : ""}
            <p class="aide">Tes réglages, tes rubriques et tes épisodes sont gardés : seul le code change.</p>
            <button type="button" class="bouton plein" data-action="mettre-a-jour">Mettre à jour</button></div>`
          : `<button type="button" class="bouton gris" data-action="verifier-maj">Chercher une nouvelle version</button>`}
        ${d.maj_modele === "prive" ? `<p class="aide">Le modèle n'est pas public : les mises à jour arriveront quand il le sera.</p>` : ""}
        <button type="button" class="bouton gris" data-action="recharger">Recharger les données</button></section>`,
  }[cle];
  return `${entete(titre, "Réglages")}${corps ? corps() : ""}`;
}

// Chaque voix est un animateur possible, appelé par son prénom (son nom de voix
// tant qu'on ne lui en donne pas). Les habituels, les jours et le tirage au sort
// se choisissent parmi les voix utilisées.
function vueVoix() {
  const d = S.d, r = d.reglages, v = r.voix;
  const nomDe = (voix) => (v.noms || {})[voix] || voix;
  const utilisee = (voix) => !(v.inactives || []).includes(voix);
  const habituelles = v.animateurs.map((a) => a.voix);
  const voulus = v.solo ? 1 : 2;
  // Dans la case : le prénom seul ; dans la feuille de choix : la voix et son timbre.
  const optionsVoix = (choisie) => [["Voix féminines", "f"], ["Voix masculines", "m"]].map(([groupe, genre]) => {
    const liste = d.listes.voix.filter((x) => x.genre === genre && (utilisee(x.nom) || x.nom === choisie))
      .sort((a, b) => nomDe(a.nom).localeCompare(nomDe(b.nom), "fr"));
    return liste.length ? `<optgroup label="${groupe}">${liste.map((x) => `<option value="${x.nom}" label="${h(nomDe(x.nom))}" ${choisie === x.nom ? "selected" : ""}>${h(nomDe(x.nom))}${nomDe(x.nom) !== x.nom ? ` · ${x.nom}` : ""} — ${h(x.description)}</option>`).join("")}</optgroup>` : "";
  }).join("");
  const aideMode = {
    fixe: `${v.solo ? "L'animateur habituel présente" : "Les animateurs habituels présentent"} chaque épisode.`,
    jours: "Choisis qui présente chaque jour. Au départ, ce sont les animateurs habituels.",
    aleatoire: `Chaque épisode tire au sort ${v.solo ? "une voix" : "deux voix"} parmi les ${d.listes.voix.filter((x) => utilisee(x.nom)).length} voix utilisées (« Les voix », plus bas).`,
  }[v.mode] || "";
  const ligneVoix = (x) => {
    const nom = nomDe(x.nom), active = utilisee(x.nom), habituelle = habituelles.includes(x.nom);
    const pret = r.echantillons[x.nom] && r.temps_echantillons[x.nom];
    const enCours = X.voix === x.nom && !extrait.paused;
    return `<div class="voix-ligne${active ? "" : " eteinte"}">
      <input class="nom-voix" maxlength="20" value="${h(nom === x.nom ? "" : nom)}" placeholder="${x.nom}" data-nom-voix="${x.nom}" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-label="Prénom de la voix ${x.nom}">
      <button type="button" class="mini-inter" role="switch" aria-checked="${active}" data-voix-active="${x.nom}" aria-label="Utiliser ${h(nom)}"><span class="rail"><span></span></span></button>
      <div class="detail"><span class="aide">${nom !== x.nom ? `${x.nom} · ` : ""}${h(x.description)}${habituelle ? " · habituel" : active ? "" : " · pas utilisée"}</span>
        ${pret ? `<button type="button" class="coche ecoute" data-extrait="${x.nom}" aria-label="${enCours ? "Pause" : "Écouter"} ${h(nom)}">${enCours ? PAUSE : LECTURE}${enCours ? "Pause" : "Écouter"}</button>`
          : `<button type="button" class="coche" role="checkbox" aria-checked="${S.aPreparer.includes(x.nom)}" data-a-preparer="${x.nom}" aria-label="Préparer l'extrait de ${h(nom)}">${S.aPreparer.includes(x.nom) ? "✓ " : ""}Préparer</button>`}</div></div>`;
  };
  return `<section class="bloc">
      <div class="reglage"><span>Vitesse</span>${choix("voix.vitesse", v.vitesse, d.listes.vitesses.map((x) => [x, majuscule(x)]))}</div>
    </section>
    <section class="carte" aria-labelledby="t-anim">
      <h2 id="t-anim">Animateurs</h2>
      <p class="aide" style="font-size:14px;color:var(--doux-2)">Prochain épisode : ${h(v.du_prochain.map((a) => a.nom).join(" & "))}</p>
      <div class="segments" style="grid-template-columns:repeat(3,minmax(0,1fr));background:var(--carte-2)">
        ${Object.entries(d.listes.modes_voix).map(([m, n]) => `<button type="button" style="font-size:13px" data-valeur-segment="${m}" data-chemin="voix.mode" aria-pressed="${v.mode === m}">${n}</button>`).join("")}</div>
      <div class="bloc" style="background:var(--carte-2)">${interrupteur("Une seule voix (sans second animateur)", v.solo, 'data-regler-bool="voix.solo"')}</div>
      <span class="groupe">Animateurs habituels</span>
      <div class="bloc" style="background:var(--carte-2)">
        ${v.animateurs.map((a, i) => `<div class="reglage${v.solo && i === 1 && v.mode === "fixe" ? " grise" : ""}"><span>Animateur ${i + 1}${v.solo && i === 1 && v.mode === "fixe" ? '<br><span class="aide">Pas utilisé avec une seule voix</span>' : ""}</span>
          <select class="compacte choix-voix" data-regler="voix.animateurs.${i}.voix" aria-label="Animateur habituel ${i + 1}">${optionsVoix(a.voix)}</select></div>`).join("")}
      </div>
      <p class="aide">${aideMode}</p>
      ${v.mode === "jours" ? `<div class="bloc" style="background:var(--carte-2)">${d.listes.jours.map(([j, court, long]) => `<div class="jour-voix${d.planning.jours[j] ? "" : " grise"}">
          <span title="${majuscule(long)}${d.planning.jours[j] ? "" : " : pas d'épisode"}">${court}</span>
          <div style="--places:${voulus}">${(v.jours[j] || habituelles).slice(0, voulus).map((x, i) => `<select class="compacte choix-voix" data-voix-jour="${j}" data-place="${i}" aria-label="${majuscule(long)} : animateur ${i + 1}">${optionsVoix(x)}</select>`).join("")}</div></div>`).join("")}</div>
        ${Object.values(d.planning.jours).some((x) => !x) ? `<p class="aide">Les jours grisés n'ont pas d'épisode (Planning).</p>` : ""}` : ""}
    </section>
    <section class="carte" aria-labelledby="t-ecoute"><h2 id="t-ecoute">Les voix</h2>
      <p class="aide">Chaque voix est un animateur possible, appelé par son prénom : écris-en un pour la renommer, ou laisse vide pour garder son nom. Coupe celles que tu ne veux pas entendre.</p>
      <p class="aide">Pour écouter une voix, coche « Préparer » puis prépare les extraits (16 par jour au plus). Ils restent ici${d.telegram ? ", pas dans la conversation" : ""}.</p>
      ${[["Conseillées", (x) => x.conseillee], ["Voix féminines", (x) => !x.conseillee && x.genre === "f"], ["Voix masculines", (x) => !x.conseillee && x.genre === "m"]]
        .map(([groupe, filtre]) => `<span class="groupe">${groupe}</span><div class="bloc" style="background:var(--carte-2)">${d.listes.voix.filter(filtre).map(ligneVoix).join("")}</div>`).join("")}
      ${S.aPreparer.length ? `<button type="button" class="bouton plein" data-action="extraits">Préparer ${S.aPreparer.length > 1 ? `ces ${S.aPreparer.length} extraits` : "cet extrait"}</button>` : ""}
    </section>`;
}

// Clés et agendas : saisis ici, testés par le bot, jamais réaffichés en entier.
function etatCle(k) {
  if (k.source === "app") return `<span class="badge ok">Dans l'application · …${h(k.fin)}</span>`;
  if (k.source === "github") return `<span class="badge ok">Secret GitHub</span>`;
  if (k.source === "absente") return `<span class="badge ${k.obligatoire ? "manque" : "neutre"}">${k.obligatoire ? "Manquante" : "Pas encore"}</span>`;
  return `<span class="badge neutre">Vérifiée au prochain épisode</span>`;
}

function carteCle(nom, k, compacte = false) {
  return `<section class="carte" aria-labelledby="t-cle-${nom}">
    <div class="entre"><h2 id="t-cle-${nom}">${h(k.nom)}${k.obligatoire ? "" : ' <span class="aide" style="font-weight:400">facultatif</span>'}</h2>${etatCle(k)}</div>
    ${compacte ? "" : `<p class="aide">${h(k.role)}${k.teste ? ` Testée le ${h(dateLongue(k.teste.slice(0, 10)))}.` : ""}</p>`}
    <div class="ajout"><input class="saisie" type="password" autocomplete="off" spellcheck="false" maxlength="300" placeholder="${k.source === "app" ? "Nouvelle clé" : "Colle ta clé ici"}" data-nouveau="cle-${nom}" aria-label="Clé ${h(k.nom)}">
      <button type="button" class="bouton gris" data-tester-cle="${nom}">Tester</button></div>
    <div class="entre"><button type="button" class="lien" data-lien="${h(k.lien)}">Où la trouver ?</button>
      ${k.source === "app" ? `<button type="button" class="lien" style="color:var(--rouge)" data-cle-retirer="${nom}">Retirer</button>` : ""}</div>
  </section>`;
}

function vueConnexions() {
  const c = S.d.connexions;
  return `<p class="aide" style="font-size:14px;color:var(--doux-2)">Tes clés restent chez ton bot : jamais affichées en entier, jamais dans le code. Chacune est testée avant d'être enregistrée, et l'emporte sur le secret GitHub du même nom.</p>

      <button type="button" class="bouton gris" data-action="bienvenue-generer">Générer mon premier épisode</button>

async function bienvenueSuivante(sens) {
  const etape = ETAPES_BIENVENUE[B.etape];
  if (sens > 0 && etape === "heure") {
    // Les heures choisies, jour par jour (le planning garde ensuite la main).
    for (const j of ["lun", "mar", "mer", "jeu", "ven"]) await demander("jour", { jour: j, heure: B.semaine }, { discret: true });
    for (const j of ["sam", "dim"]) await demander("jour", { jour: j, heure: B.weekendActif ? B.weekend : null }, { discret: true });
  }
  if (sens > 0 && B.etape === ETAPES_BIENVENUE.length - 1) {
    await demander("bienvenue_fin", {}, { discret: true });
    S.ecran = "programme";
    annoncer("Tout est prêt.");
    return dessiner();
  }
  B.etape = Math.max(0, Math.min(ETAPES_BIENVENUE.length - 1, B.etape + sens));
  dessiner();
  window.scrollTo(0, 0);
}

      <div class="champ"><span class="etiquette">Thèmes à éviter</span>${etiquettes("actus.sujets_a_eviter", r.actus.sujets_a_eviter, "Ex. sport, people")}</div>

        <button type="button" class="icone" data-retirer-source="${i}" aria-label="Retirer ${h(f.nom)}">${icone("croix", 18, 2)}</button></div>`).join("")}</div>
      <div class="champ"><label for="n-source">Ajouter un média</label><div class="ajout"><input id="n-source" class="saisie" maxlength="300" placeholder="Son nom ou l'adresse de son flux RSS" data-nouveau="source">
        <button type="button" class="bouton gris" data-action="ajouter-source">Ajouter</button></div><p class="aide">Avec un nom (« 24 heures »), je cherche son flux RSS : ça prend quelques secondes.</p></div>
      ${r.actus.flux_defaut ? "" : `<button type="button" class="bouton pointille" data-action="sources-defaut">Revenir aux médias proposés pour ton pays</button>`}`;

function vueIntegree() {
  const d = S.d, cle = S.integree, info = INTEGREES[cle];
  const i = d.deroule.findIndex((y) => y.cle === cle);
  const x = d.deroule[i];
  if (!x || !info) return `${entete("Rubrique", "Ton épisode")}<div class="vide">Cette rubrique n'existe plus.</div>`;
  const avant = i > 0 ? d.deroule[i - 1].nom : null;
  const corps = CORPS_INTEGREES[cle];
  return `${entete(x.nom, "Fournie avec l'application")}
  <section class="section-fiche"><h2>Ce qu'elle raconte</h2><p style="margin:0;line-height:1.45">${h(info.texte)}</p></section>
  <section class="section-fiche"><h2>Dans l'épisode</h2>
    ${info.fixe ? `<p class="aide">${h(info.fixe)}</p>` : `<div class="bloc">${interrupteur("Dans mes épisodes", x.actif, `data-actif-integree="${h(cle)}"`)}</div>
    <p class="aide">${avant ? `Après « ${h(avant)} ». ` : ""}${SI_CONTENU.includes(cle) ? "Elle ne passe que s'il y a de quoi en parler. " : ""}L'ordre se change dans « Ton épisode ».</p>`}
  </section>
  ${corps ? `<section class="section-fiche"><h2>${cle === "actualites" ? "Ce qu'elle lit" : "Réglages"}</h2>${corps()}</section>` : ""}`;
}

async function regler(chemin, valeur) {
  return changer("regler", { chemin, valeur });
}

async function majListe(chemin, valeurs) {
  return changer("liste", { chemin, valeurs });
}

function listeActuelle(chemin) {
  const r = S.d.reglages;
  return chemin === "consignes" ? [...r.consignes] : [...r.actus[chemin.split(".")[1]]];
}

// ─────────────────────────────── événements ─────────────────────────────
document.addEventListener("click", (ev) => {
  const el = ev.target.closest("button");
  if (!el || el.disabled) return;
  const ds = el.dataset;
  if (el.id === "mini-titre") { S.episode = L.cle; return aller("episode"); }
  if (ds.mini !== undefined) { if (audio.paused) audio.play(); else audio.pause(); return; }
  if (ds.vitesse !== undefined) return changerVitesse();
  if (ds.aller) return aller(ds.aller);
  if (ds.destination) {
    if (ds.destination.startsWith("r:")) { S.reglage = ds.destination.slice(2); return aller("reglage"); }
    if (ds.destination.startsWith("i:")) { S.integree = ds.destination.slice(2); return aller("integree"); }
    return aller(ds.destination);
  }
  if (ds.reglage) { S.reglage = ds.reglage; return aller("reglage"); }
  if (ds.integree) { S.integree = ds.integree; return aller("integree"); }
  if (ds.modele) { const m = modeles().find((x) => x.id === ds.modele); return m && ouvrirFiche(null, m); }
  if (ds.consigneRubrique !== undefined) return rubriqueDepuisConsigne(Number(ds.consigneRubrique));
  if (ds.actifRegle) {
    const actif = el.getAttribute("aria-checked") !== "true";
    el.setAttribute("aria-checked", String(actif));
    el.closest("li").classList.toggle("eteint", !actif);
    vibrer("choix");
    return changer("etat_rubrique", { id: ds.actifRegle, active: actif });
  }
  if (ds.actifIntegree) {
    return changer("deroule", { ordre: S.d.deroule.map((x) => x.cle), actifs: { [ds.actifIntegree]: el.getAttribute("aria-checked") !== "true" } });
  }
  if (ds.ouvrir) return ouvrirFiche(ds.ouvrir);
  if (ds.testerCle) {
    const champ = document.querySelector(`[data-nouveau="cle-${ds.testerCle}"]`);
    const valeur = champ ? champ.value.trim() : "";
    if (!valeur) return annoncer("Colle d'abord la clé.", true);
    annoncer("Je teste la clé…");
    return changer("cle", { nom: ds.testerCle, valeur });
  }
  if (ds.cleRetirer) return confirmer("Retirer cette clé de l'application ? Le secret GitHub, s'il existe, prendra le relais.", () => changer("cle", { nom: ds.cleRetirer, valeur: "" }));
  if (ds.notifRetirer) return confirmer("Ne plus prévenir cet appareil ?", () => {
    if (((S.d.notifications || {}).abonnements || []).some((a) => a.id === ds.notifRetirer && a.fin === NOTIF.fin)) return couperNotifs();
    return changer("notif_retirer", { id: ds.notifRetirer });
  });
  if (ds.appareilRetirer) return confirmer("Retirer cet appareil ? Il devra entrer un nouveau code.", () => changer("appareil_retirer", { id: ds.appareilRetirer }));
  if (ds.agendaRetirer) return confirmer("Retirer cet agenda ?", () => changer("agenda_retirer", { id: ds.agendaRetirer }));
  if (ds.bienvenue) return bienvenueSuivante(Number(ds.bienvenue));
  if (ds.bienvenueWeekend !== undefined) { B.weekendActif = !B.weekendActif; vibrer("choix"); return dessiner(); }
  if (ds.episode) { S.episode = ds.episode; return aller("episode"); }
  if (ds.choisir) { S.choisi = ds.choisir; vibrer("choix"); return dessiner(); }
  if (ds.moisEp !== undefined) { if (ds.moisEp) { S.moisEpisodes = ds.moisEp; dessiner(); } return; }
  if (ds.lire) return basculer(episodeParCle(ds.lire));
  if (ds.chapitre) return jouer(episodeParCle(ds.chapitre), Number(ds.t));
  if (ds.geste) return geste(ds.cle, ds.geste);
  if (ds.texte) return demander("texte", { cle: ds.texte }).then((j) => { if (j.ok) { S.texte = { cle: ds.texte, texte: j.texte }; dessiner(); } });
  if (ds.extrait) return basculerExtrait(ds.extrait);
  if (ds.aPreparer) { S.aPreparer = S.aPreparer.includes(ds.aPreparer) ? S.aPreparer.filter((x) => x !== ds.aPreparer) : [...S.aPreparer, ds.aPreparer]; vibrer("choix"); return dessiner(); }
  if (ds.voixActive) return changer("voix_active", { voix: ds.voixActive, active: el.getAttribute("aria-checked") !== "true" });
  if (ds.lien) return ouvrirLien(ds.lien);
  if (ds.creuser) return changer("creuser", { sujet: ds.creuser }, () => {});
  if (ds.chercher) return chercher(ds.chercher, "ecrit");
  if (ds.sauter) return confirmer(`Pas d'épisode le ${dateLongue(ds.sauter)} ?`, () => changer("sauter", { date: ds.sauter }));
  if (ds.retablir) return changer("retablir", { date: ds.retablir });
  if (ds.jourcal) return toucherJour(ds.jourcal);
  if (ds.mois) { S.mois = Number(ds.mois); return dessiner(); }
  if (ds.jourActif) { const actif = S.d.planning.jours[ds.jourActif]; return changer("jour", { jour: ds.jourActif, heure: actif ? null : "07:30" }); }
  if (ds.pas) return regler(ds.pas, Number(ds.valeur));
  if (ds.valeurSegment) return regler(ds.chemin, ds.valeurSegment);
  if (ds.reglerBool) return regler(ds.reglerBool, el.getAttribute("aria-checked") !== "true");
  if (ds.agenda) return changer("agenda", { id: ds.agenda, lu: el.getAttribute("aria-checked") !== "true" });
  if (ds.retirerListe) { const l = listeActuelle(ds.retirerListe); l.splice(Number(ds.i), 1); return majListe(ds.retirerListe, l); }
  if (ds.ajouterListe) {
    const champ = document.querySelector(`[data-nouveau="${ds.ajouterListe}"]`);
    const valeurs = String(champ && champ.value || "").split(ds.ajouterListe === "consignes" ? /\n/ : /[,;]/).map((x) => x.trim()).filter(Boolean);
    if (!valeurs.length) return annoncer("Écris d'abord ce que tu veux ajouter.", true);
    return majListe(ds.ajouterListe, [...listeActuelle(ds.ajouterListe), ...valeurs]);
  }
  if (ds.retirerSource) return changer("retirer_source", { index: Number(ds.retirerSource) });
  if (ds.retirerCreuser) return changer("retirer_creuser", { index: Number(ds.retirerCreuser) });
  if (ds.actif) {
    const x = S.d.deroule.find((y) => y.cle === ds.actif);
    if (!x) return;
    el.setAttribute("aria-checked", String(!x.actif));
    el.closest("li").classList.toggle("eteint", x.actif);
    vibrer("choix");
    return enregistrerDeroule({ [ds.actif]: !x.actif });
  }
  if (S.fiche && S.ecran === "fiche") {
    const f = S.fiche.f;
    let change = true;
    if (ds.retirerBulle) f[ds.retirerBulle].splice(Number(ds.i), 1);
    else if (ds.action === "passage") f.longueur = f.longueur === "aucune" ? "courte" : "aucune";
    else if (ds.longueur) f.longueur = ds.longueur;
    else if (ds.jour) f.periode.jours = f.periode.jours.includes(ds.jour) ? f.periode.jours.filter((j) => j !== ds.jour) : [...f.periode.jours, ds.jour];
    else if (ds.source) f.sources = f.sources.includes(ds.source) ? f.sources.filter((s) => s !== ds.source) : [...f.sources, ds.source];
    else if (ds.bascule) { const [a, b] = ds.bascule.split("."); if (b) f[a][b] = !f[a][b]; else f[a] = !f[a]; }
    else change = false;
    if (change) { S.fiche.modifie = true; vibrer("choix"); return dessiner(); }
  }
  switch (ds.action) {
    case "generer":
      return confirmer(`Générer un nouvel épisode maintenant ? Il arrivera ici${S.d.telegram && S.d.reglages.livraison.telegram !== false ? " et dans la conversation" : ""}.`, () => changer("generer", {}, () => {}));
    case "fermer": return tg ? tg.close() : null;
    case "nouvelle": return aller("catalogue");
    case "nouvelle-recherche": return ouvrirFiche(null, { id: "recherche" });
    case "garder": {
      // Une recherche devient une rubrique de l'épisode : on choisit quand elle passe.
      const f = S.fiche.f;
      f.periode = { type: "toujours", debut: "", fin: "", jours: [] };
      f.longueur = "courte";
      S.fiche.origine = "programme";
      S.fiche.modifie = true;
      annoncer("Choisis quand elle passe, puis enregistre.");
      dessiner();
      return window.scrollTo(0, 0);
    }
    case "retour": return retour();
    case "plus": return menuFiche();
    case "enregistrer": return enregistrerFiche();
    case "condition": S.fiche.f.condition = { texte: "", moment: "jour_meme", n: 1 }; S.fiche.modifie = true; return dessiner();
    case "sans-condition": S.fiche.f.condition = null; S.fiche.modifie = true; return dessiner();
    case "recherche": S.fiche.recherche = true; return dessiner();
    case "annuler": return changer("annuler");
    case "parler-confirmer": return repondreConfirmation(true);
    case "parler-abandonner": return repondreConfirmation(false);
    case "envoyer": { const t = document.getElementById("demande"); const v = t ? t.value : ""; if (t) t.value = ""; return envoyerDemande(v); }
    case "vocal": return V.enCours ? arreterVocal(true) : demarrerVocal();
    case "vocal-annuler": return arreterVocal(false);
    case "parler-sujets": {
      const ep = episodeParCle(ds.cle);
      S.ecran = "parler"; dessiner();
      const t = document.getElementById("demande");
      if (t) { t.value = `Ces sujets m'intéressaient peu : ${(ep && ep.sujets || []).join(", ")}. `; t.focus(); }
      return;
    }
    case "ajouter-source": {
      const champ = document.querySelector('[data-nouveau="source"]');
      if (!champ || !champ.value.trim()) return annoncer("Écris le nom du média ou l'adresse de son flux.", true);
      annoncer("Je cherche le flux RSS…");
      return changer("source", { valeur: champ.value.trim() });
    }
    case "sources-defaut": return confirmer("Revenir aux sources par défaut ?", () => changer("sources_defaut"));
    case "ajouter-creuser": {
      const champ = document.querySelector('[data-nouveau="creuser"]');
      return changer("creuser", { sujet: champ ? champ.value : "" });
    }
    case "lire-agendas": return changer("lire_agendas", {}, () => {});
    case "agenda-ajouter": {
      const champ = document.querySelector('[data-nouveau="agenda-url"]');
      const url = champ ? champ.value.trim() : "";
      if (!url) return annoncer("Colle d'abord l'adresse de ton agenda.", true);
      annoncer("Je lis ton agenda…");
      return changer("agenda_ajouter", { url });
    }
    case "bienvenue-generer": return changer("generer", {}, () => {});
    case "creer-flux": return changer("flux", {});
    case "code-appareil": return changer("appareil_code", {});
    case "notif-activer": return activerNotifs();
    case "notif-couper": return couperNotifs();
    case "notif-tester": return changer("notif_tester", {});
    case "verifier-maj": return changer("verifier_maj", {});
    case "mettre-a-jour": return confirmer("Mettre à jour le code de ton podcast ? Tes réglages sont gardés.", () => changer("mettre_a_jour", {}));
    case "connecter-appareil": return connecterAppareil();
    case "deconnecter-appareil": return confirmer("Déconnecter cet appareil ? Il faudra un nouveau code pour le rouvrir.", () => { jetonAppareil.ecrire(""); vueConnexionAppareil(); });
    case "renouveler-flux": return confirmer("Changer l'adresse du flux ? L'ancienne ne marchera plus : il faudra ajouter la nouvelle dans ton appli de podcasts.", () => changer("flux", { renouveler: true }));
    case "copier-flux": {
      const champ = document.getElementById("adresse-flux");
      const copie = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(S.d.flux) : Promise.reject();
      return copie.then(() => { vibrer("success"); annoncer("Adresse copiée"); }).catch(() => {
        if (champ) { champ.focus(); champ.select(); }
        annoncer("Adresse sélectionnée : copie-la avec le menu du téléphone.");
      });
    }
    case "extraits": return changer("extraits", { voix: S.aPreparer }, (j) => { if (j.ok) S.aPreparer = []; dessiner(); });
    case "ecran-accueil": try { tg.addToHomeScreen(); } catch (e) { annoncer("Impossible ici : mets Telegram à jour.", true); } return;
    case "recharger": return demarrer();
  }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (!t.dataset) return;
  if (t.dataset.champ && S.fiche && t.tagName !== "SELECT") return saisirChamp(t);
  if (t.dataset.avance && L.cle === t.dataset.avance) { audio.currentTime = Number(t.value); return; }
});
document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (!t.dataset) return;
  if (t.dataset.bulle) return ajouterBulle(t);
  if (t.dataset.region !== undefined) return changer("feries", { region: t.value });
  if (t.dataset.nomVoix) return changer("nom_voix", { voix: t.dataset.nomVoix, nom: t.value });
  if (t.dataset.voixJour) {
    // Les deux voix du jour telles qu'affichées ; choisir celle de l'autre place les échange.
    const places = [...S.d.reglages.voix.jours[t.dataset.voixJour]], i = Number(t.dataset.place);
    if (places[1 - i] === t.value) places[1 - i] = places[i];
    places[i] = t.value;
    return changer("voix_jour", { jour: t.dataset.voixJour, voix: places });
  }
  if (t.dataset.bienvenueHeure) { if (t.value) B[t.dataset.bienvenueHeure] = t.value; return; }
  if (t.dataset.champ && S.fiche && t.tagName === "SELECT") return saisirChamp(t);
  if (t.dataset.jourMode) {
    const vue = t.dataset.jourMode;
    S.jourVue[vue] = t.value === "date" ? (S.jourDernier[vue] || plusJours(S.d.aujourdhui, 1)) : "";
    return dessiner();
  }
  if (t.dataset.jourDate) { if (t.value) { S.jourVue[t.dataset.jourDate] = S.jourDernier[t.dataset.jourDate] = t.value; dessiner(); } return; }
  if (t.dataset.regler) return regler(t.dataset.regler, t.value);
  if (t.dataset.reglerTexte !== undefined && t.dataset.reglerTexte) return regler(t.dataset.reglerTexte, t.value);
  if (t.dataset.heureJour) return t.value && changer("jour", { jour: t.dataset.heureJour, heure: t.value });
  if (t.dataset.consigne !== undefined) {
    const l = listeActuelle("consignes");
    if (t.value.trim()) l[Number(t.dataset.consigne)] = t.value.trim(); else l.splice(Number(t.dataset.consigne), 1);
    return majListe("consignes", l);
  }
});
document.addEventListener("keydown", (ev) => {
  if ((ev.key === "Enter" || ev.key === ",") && ev.target.dataset && ev.target.dataset.bulle) { if (ajouterBulle(ev.target) || ev.key === "Enter") ev.preventDefault(); return; }
  if (ev.key === "Enter" && ev.target.id === "code-appareil") { ev.preventDefault(); return connecterAppareil(); }
  if (ev.key === "Enter" && ev.target.dataset && ev.target.dataset.nomVoix) { ev.preventDefault(); ev.target.blur(); return; }
  if (ev.key === "Enter" && !ev.shiftKey && ev.target.id === "demande") { ev.preventDefault(); const v = ev.target.value; ev.target.value = ""; envoyerDemande(v); }
});
// Après une longue absence, les données (et les liens audio) se rafraîchissent.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && S.d && Date.now() - S.charge > 30 * 60000 && S.ecran !== "fiche") {
    S.archives = {};   // mois archivés rechargés à la demande, avec des liens neufs
    demander("etat", {}, { discret: true }).then((j) => { if (j.ok) dessiner(); });
  }
});

// ─────────────────────────────── démarrage ──────────────────────────────
// Hors de Telegram, sans jeton : on demande le code affiché dans l'application.
function vueConnexionAppareil() {
  navEl.classList.add("cache");
  miniEl.classList.add("cache");
  ecranEl.innerHTML = `<div class="connexion">
    <span class="icone-app" aria-hidden="true">${icone("aube", 40, 1.6)}</span>
    <h1>Podcast Matin</h1>
    <p class="aide" style="font-size:15px;color:var(--doux-2)">Pour ouvrir ton podcast sur cet appareil, entre un code à 6 chiffres : affiché dans l'application déjà ouverte ailleurs (<b>Réglages › Application</b>), ou donné par GitHub (onglet <b>Actions › Code de connexion</b>).</p>
    <input id="code-appareil" class="saisie" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456" aria-label="Code à 6 chiffres" style="font-size:28px;letter-spacing:.3em;text-align:center">
    <button type="button" class="bouton plein" data-action="connecter-appareil">Ouvrir le podcast</button>
    ${estIOS() && !autonome() ? `<p class="aide">Sur iPhone, ajoute d'abord cette page à ton écran d'accueil (bouton Partager › « Sur l'écran d'accueil ») et ouvre-la depuis l'icône : c'est là que les notifications marchent, et tu n'auras qu'un code à entrer.</p>` : ""}
  </div>`;
  const champ = document.getElementById("code-appareil");
  // Lien de connexion (…/app#code=123456, donné par GitHub) : le code est déjà là.
  const donne = /(?:^#|&)code=(\d{6})\b/.exec(location.hash || "");
  if (champ && donne) {
    champ.value = donne[1];
    if (history.replaceState) history.replaceState(null, "", location.pathname + location.search);
    if (!(estIOS() && !autonome())) connecterAppareil();
  } else if (champ) champ.focus();
}

function nomAppareil() {
  const ua = navigator.userAgent;
  const systeme = /iPhone/.test(ua) ? "iPhone" : /iPad/.test(ua) ? "iPad" : /Android/.test(ua) ? "Android" : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : /Linux/.test(ua) ? "Linux" : "Appareil";
  const navigateur = /Edg\//.test(ua) ? "Edge" : /Firefox\//.test(ua) ? "Firefox" : /Chrome\//.test(ua) ? "Chrome" : /Safari\//.test(ua) ? "Safari" : "";
  const installe = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
  return `${systeme}${navigateur ? ` · ${navigateur}` : ""}${installe ? " (écran d'accueil)" : ""}`;
}

// ───────────────────────────── notifications ──────────────────────────────
// Hors de Telegram : le navigateur s'abonne (Web Push) et le bot y envoie
// « ton épisode est prêt ». Sur iPhone, seulement depuis l'icône de l'écran d'accueil.
const NOTIF = { fin: null, lu: false };
const estIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const autonome = () => (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const notifsPossibles = () => !tg && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const octetsDe = (b64) => Uint8Array.from(atob(b64.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(b64.length / 4) * 4, "=")), (c) => c.charCodeAt(0));

async function abonnementLocal(mettreAJour = false) {
  if (!notifsPossibles()) return null;
  const reg = await navigator.serviceWorker.getRegistration("/app").catch(() => null);
  if (reg && mettreAJour) reg.update().catch(() => {});   // service worker à jour (icône, textes)
  return reg ? reg.pushManager.getSubscription().catch(() => null) : null;
}

// Au démarrage : cet appareil est-il abonné ? (et l'abonnement, renouvelé par le navigateur, est-il connu du bot ?)
async function lireNotifs() {
  const abo = await abonnementLocal(true);
  NOTIF.fin = abo ? abo.endpoint.slice(-16) : null;
  NOTIF.lu = true;
  const connus = ((S.d && S.d.notifications && S.d.notifications.abonnements) || []).map((a) => a.fin);
  if (abo && Notification.permission === "granted" && !connus.includes(NOTIF.fin)) {
    await demander("notif_abonner", { abonnement: abo.toJSON(), nom: nomAppareil() }, { discret: true });
  }
}

async function activerNotifs() {
  // La demande d'autorisation doit suivre directement le toucher (iPhone).
  const permission = await Notification.requestPermission();
  if (permission !== "granted") { dessiner(); return annoncer("Notifications refusées : autorise-les pour ce site dans les réglages du navigateur.", true); }
  try {
    const reg = await navigator.serviceWorker.register("/app/sw.js", { scope: "/app" });
    await navigator.serviceWorker.ready;
    const cle = octetsDe(S.d.notifications.cle);
    let abo = await reg.pushManager.getSubscription();
    if (abo && abo.options && abo.options.applicationServerKey
        && btoa(String.fromCharCode(...new Uint8Array(abo.options.applicationServerKey))) !== btoa(String.fromCharCode(...cle))) {
      await abo.unsubscribe(); abo = null;   // abonnement fait avec une autre clé
    }
    if (!abo) abo = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: cle });
    NOTIF.fin = abo.endpoint.slice(-16);
    await changer("notif_abonner", { abonnement: abo.toJSON(), nom: nomAppareil() });
  } catch (e) {
    annoncer("Ce navigateur n'a pas pu s'abonner aux notifications.", true);
  }
}

async function couperNotifs() {
  const abo = await abonnementLocal();
  if (abo) { await abo.unsubscribe().catch(() => {}); }
  const fiche = ((S.d.notifications || {}).abonnements || []).find((a) => a.fin === NOTIF.fin);
  NOTIF.fin = null;
  if (fiche) await changer("notif_retirer", { id: fiche.id }); else dessiner();
}

function vueNotifs(d) {
  const n = d.notifications || { abonnements: [] };
  const ici = n.abonnements.find((a) => a.fin && a.fin === NOTIF.fin);
  let local;
  if (tg) local = `<p class="aide">Les notifications s'activent dans le navigateur de ton téléphone : ouvre ton podcast hors de Telegram (ci-dessous), puis reviens ici.</p>`;
  else if (estIOS() && !autonome()) local = `<p class="aide">Sur iPhone, ajoute d'abord l'application à ton écran d'accueil (bouton Partager › « Sur l'écran d'accueil »), ouvre-la depuis l'icône et entre un code : tu pourras alors activer les notifications.</p>`;
  else if (!notifsPossibles()) local = `<p class="aide">Ce navigateur ne sait pas recevoir de notifications.</p>`;
  else if (Notification.permission === "denied") local = `<p class="aide">Les notifications sont bloquées pour ce site : autorise-les dans les réglages du navigateur, puis reviens ici.</p>`;
  else if (ici) local = `<div class="entre"><p class="aide">✅ Activées sur cet appareil.</p>
      <button type="button" class="lien" data-action="notif-couper">Couper ici</button></div>`;
  else local = `<button type="button" class="bouton plein" data-action="notif-activer">Activer sur cet appareil</button>`;
  return `<section class="carte" aria-labelledby="t-notifs"><h2 id="t-notifs">Notifications</h2>
      <p class="aide">Une notification sur ton téléphone dès que ton épisode est prêt, ou si quelque chose coince. Touche-la : l'épisode s'ouvre.</p>
      ${local}
      ${n.abonnements.length ? `<span class="etiquette" style="font-size:13px;color:var(--doux)">Appareils prévenus</span>
        <div class="bloc" style="background:var(--carte-2)">${n.abonnements.map((a) => `<div class="reglage"><span>${h(a.nom)}${a.fin === NOTIF.fin ? " (celui-ci)" : ""}<br>
          <span class="aide">${a.erreur ? `Dernier envoi ${h(a.erreur)}` : `Depuis le ${h(dateLongue(String(a.cree_le).slice(0, 10)))}`}</span></span>
          <button type="button" class="lien" style="color:var(--rouge)" data-notif-retirer="${h(a.id)}">Retirer</button></div>`).join("")}</div>
        <button type="button" class="bouton gris" data-action="notif-tester">Envoyer un essai</button>` : ""}
      ${d.telegram ? `${interrupteur("Recevoir aussi l'épisode dans Telegram", d.reglages.livraison.telegram !== false, 'data-regler-bool="livraison.telegram"')}
      <p class="aide">${d.reglages.livraison.telegram !== false ? "Tu le reçois dans Telegram et ici."
        : `Ton épisode n'arrive plus dans Telegram : il t'attend ici${d.flux ? ", dans ton appli de podcasts" : ""}${n.abonnements.length ? " et par notification" : ""}. Les alertes (épisode raté…) restent dans Telegram.`}</p>` : ""}
    </section>`;
}

async function connecterAppareil() {
  const champ = document.getElementById("code-appareil");
  const code = champ ? champ.value.replace(/\D/g, "") : "";
  if (code.length !== 6) return annoncer("Le code a 6 chiffres.", true);
  try {
    const r = await fetch("/app/connexion", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code, nom: nomAppareil() }) });
    const j = await r.json();
    if (!j.ok) return annoncer(j.erreur || "Connexion impossible.", true);
    jetonAppareil.ecrire(j.jeton);
    annoncer("Cet appareil est connecté.");
    demarrer();
  } catch (e) {
    annoncer("Pas de connexion au bot. Vérifie ton réseau et réessaie.", true);
  }
}

async function demarrer() {
  if (!tg && !jetonAppareil.lire()) return vueConnexionAppareil();
  const j = await demander("etat", {}, { toujours: true });
  if (!j.ok || !S.d) {
    ecranEl.innerHTML = `<div class="chargement"><h1 style="margin-bottom:12px">Oups</h1>${h(j.erreur || "Le bot ne répond pas.")}<br><br>
      <button type="button" class="bouton plein" data-action="recharger">Réessayer</button></div>`;
    return;
  }
  // Ouverture depuis le bouton sous un épisode : directement sur cet épisode.
  if (S.d.bienvenue) S.ecran = "bienvenue";
  // Depuis une notification : ?ep=<clé de l'épisode> ou ?ecran=resultats.
  const parametres = new URLSearchParams(location.search);
  const voulu = parametres.get("episode"), cleVoulue = parametres.get("ep");
  const ep = (cleVoulue && S.d.episodes.find((e) => e.cle === cleVoulue)) || (voulu && S.d.episodes.find((e) => e.date === voulu));
  if (ep) { S.episode = ep.cle; S.ecran = "episode"; }
  else if (parametres.get("ecran") === "resultats" && S.d.resultats) S.ecran = "resultats";
  if (parametres.toString() && history.replaceState) history.replaceState(null, "", "/app");
  dessiner();
  if (!tg) lireNotifs().then(() => { if (S.ecran === "reglage") dessiner(); });
}

if (tg) {
  tg.ready();
  tg.expand();
  try {
    tg.setHeaderColor("#12151C"); tg.setBackgroundColor("#12151C");
    if (tg.setBottomBarColor) tg.setBottomBarColor("#161A22");
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.onEvent) tg.onEvent("homeScreenAdded", () => annoncer("Icône ajoutée à ton écran d'accueil"));
  } catch (e) { /* ancien Telegram */ }
  if (tg.BackButton) tg.BackButton.onClick(retour);
}
demarrer();
</script>
