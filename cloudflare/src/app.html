function ordreAffiche() { return [...document.querySelectorAll("#deroule li")].map((li) => li.dataset.cle); }
function renumeroter() { document.querySelectorAll("#deroule li .num").forEach((el, i) => { el.textContent = i + 1; }); }

let envoiDeroule = null;
function enregistrerDeroule(actifs) {
  clearTimeout(envoiDeroule);
  envoiDeroule = setTimeout(async () => {
    const avant = S.d.deroule.map((x) => x.cle).join(",");
    const ordre = ordreAffiche();
    if (!actifs && ordre.join(",") === avant) return;
    const j = await demander("deroule", { ordre, actifs: actifs || {} });
    if (j.ok) { vibrer("success"); annoncer("Déroulé enregistré"); }
    if (S.ecran === "programme") dessiner();
  }, actifs ? 0 : 350);
}

function brancherGlisser() {
  const liste = document.getElementById("deroule");
  if (!liste) return;
  liste.querySelectorAll("[data-poignee]").forEach((poignee) => {
    const li = poignee.closest("li");
    poignee.addEventListener("keydown", (ev) => {
      if (ev.key !== "ArrowUp" && ev.key !== "ArrowDown") return;
      ev.preventDefault();
      const voisin = ev.key === "ArrowUp" ? li.previousElementSibling : li.nextElementSibling;
      if (!voisin || !voisin.classList.contains("mobile")) return;
      if (ev.key === "ArrowUp") liste.insertBefore(li, voisin); else liste.insertBefore(voisin, li);
      renumeroter(); poignee.focus(); enregistrerDeroule();
    });
    poignee.addEventListener("pointerdown", (ev) => {
      if (ev.button !== undefined && ev.button !== 0) return;
      ev.preventDefault();
      poignee.setPointerCapture(ev.pointerId);
      const departY = ev.clientY, departHaut = li.offsetTop;
      li.classList.add("glisse");
      vibrer("choix");
      const bouger = (e) => {
        const mobiles = [...liste.querySelectorAll("li.mobile")];
        const haut = mobiles[0].offsetTop, bas = mobiles[mobiles.length - 1].offsetTop + mobiles[mobiles.length - 1].offsetHeight - li.offsetHeight;
        const voulu = Math.max(haut, Math.min(bas, departHaut + (e.clientY - departY)));
        const milieu = voulu + li.offsetHeight / 2;
        for (let cran = 0; cran < 20; cran++) {
          const avant = li.previousElementSibling, apres = li.nextElementSibling;
          if (avant && avant.classList.contains("mobile") && milieu < avant.offsetTop + avant.offsetHeight / 2) liste.insertBefore(li, avant);
          else if (apres && apres.classList.contains("mobile") && milieu > apres.offsetTop + apres.offsetHeight / 2) liste.insertBefore(apres, li);
          else break;
          vibrer("choix"); renumeroter();
        }
        li.style.transform = `translateY(${voulu - li.offsetTop}px)`;
      };
      const finir = () => {
        poignee.removeEventListener("pointermove", bouger);
        poignee.removeEventListener("pointerup", finir);
        poignee.removeEventListener("pointercancel", finir);
        li.classList.remove("glisse");
        li.style.transform = "";
        enregistrerDeroule();
      };
      poignee.addEventListener("pointermove", bouger);
      poignee.addEventListener("pointerup", finir);
      poignee.addEventListener("pointercancel", finir);
    });
  });
}

// ─────────────────────────────── planning ───────────────────────────────
// Un jour du calendrier. Le bot n'envoie que les jours qui sortent de l'habitude :
// les autres ont l'heure habituelle de leur jour de la semaine.
function jourCalendrier(date) {
  const pl = S.d.planning;
  return pl.calendrier[date] || { heure: pl.jours[CLES_JOURS[dateObj(date).getUTCDay()]] || null };
}
// Nombre de mois qu'on peut feuilleter après le mois en cours.
function moisPlanningMax() {
  const d = S.d, fin = d.planning.calendrier_jusqua;
  if (!fin) return 1;                       // bot d'avant : le mois en cours et le suivant
  return (Number(fin.slice(0, 4)) - Number(d.aujourdhui.slice(0, 4))) * 12 + Number(fin.slice(5, 7)) - Number(d.aujourdhui.slice(5, 7));
}

function vuePlanning() {
  const d = S.d, pl = d.planning;
  const premier = `${d.aujourdhui.slice(0, 8)}01`;
  const maxMois = moisPlanningMax();
  S.mois = Math.max(0, Math.min(maxMois, S.mois || 0));
  const mois = (() => { const x = dateObj(premier); x.setUTCMonth(x.getUTCMonth() + S.mois); return x.toISOString().slice(0, 10); })();
  const m = dateObj(mois);
  const decalage = (m.getUTCDay() + 6) % 7;
  const jours = [];
  for (let i = 0; i < 31; i++) { const date = plusJours(mois, i); if (date.slice(5, 7) !== mois.slice(5, 7)) break; jours.push(date); }
  const normal = (date) => pl.jours[CLES_JOURS[dateObj(date).getUTCDay()]];
  const cellule = (date) => {
    const c = jourCalendrier(date);
    const classes = [];
    if (date < d.aujourdhui) classes.push("passe");
    if (date === d.aujourdhui) classes.push("aujourdhui");
    if (c.pause) {
      // Bande continue sur les jours de la pause, arrondie à ses bouts et en fin de semaine.
      const enPause = (x) => jourCalendrier(x).pause;
      const col = (dateObj(date).getUTCDay() + 6) % 7;
      classes.push("pause");
      if (col === 0 || !enPause(plusJours(date, -1)) || date.slice(8) === "01") classes.push("debut");
      if (col === 6 || !enPause(plusJours(date, 1)) || plusJours(date, 1).slice(8) === "01") classes.push("fin");
    } else if (c.exception && !c.heure) classes.push("saute");
    else if (!c.heure) classes.push("sans");
    else if (c.exception || c.heure !== normal(date)) classes.push("autre");
    if (c.ferie) classes.push("ferie");
    const etiquette = `${dateLongue(date)} : ${c.heure ? `épisode à ${heure(c.heure)}` : "pas d'épisode"}${c.ferie ? ", férié" : ""}`;
    return `<button type="button" class="${classes.join(" ")}" data-jourcal="${date}" aria-label="${h(etiquette)}">${Number(date.slice(8))}</button>`;
  };
  return `
  <h1>Planning</h1>
  <section class="carte" aria-labelledby="t-mois">
    <div class="entre"><div style="display:flex;flex-direction:column;align-items:flex-start;min-width:0">
        <h2 id="t-mois">${majuscule(MOIS[m.getUTCMonth()])} ${m.getUTCFullYear()}</h2>
        ${S.mois > 1 ? `<button type="button" class="lien" style="min-height:32px;padding:0;font-size:13px" data-mois="0">Revenir à aujourd'hui</button>` : ""}</div>
      <div class="ligne" style="gap:4px">
        <button type="button" class="icone" style="background:var(--carte-2);width:40px;height:40px" data-mois="${S.mois - 1}" ${S.mois === 0 ? "disabled" : ""} aria-label="Mois précédent">${icone("retour", 16, 2.2)}</button>
        <button type="button" class="icone" style="background:var(--carte-2);width:40px;height:40px" data-mois="${S.mois + 1}" ${S.mois >= maxMois ? "disabled" : ""} aria-label="Mois suivant">${icone("suite", 16, 2.2)}</button>
      </div></div>
    <div class="calendrier">
      ${["L", "M", "M", "J", "V", "S", "D"].map((x) => `<span class="tete" aria-hidden="true">${x}</span>`).join("")}
      ${"<span></span>".repeat(decalage)}${jours.map(cellule).join("")}
    </div>
    <div class="legende"><span><i style="background:var(--aube);border-radius:50%"></i>Autre heure</span>
      <span><i style="background:var(--vert);border-radius:50%"></i>Férié</span><span><s>12</s>&nbsp;Sauté</span></div>
    <p class="aide">Touche un jour pour changer son heure ou ne pas avoir d'épisode (un ou plusieurs jours).</p>
  </section>
  <section class="bloc" aria-label="Heure de chaque jour">
    ${d.listes.jours.map(([j, , long]) => `<div class="reglage"><span>${majuscule(long)}</span>
      ${pl.jours[j] ? `<input type="time" class="compacte" value="${h(pl.jours[j])}" data-heure-jour="${j}" aria-label="Heure du ${long}">` : `<span class="sous">Pas d'épisode</span>`}
      <button type="button" class="mini-inter" role="switch" aria-checked="${Boolean(pl.jours[j])}" data-jour-actif="${j}" aria-label="Épisode le ${long}"><span class="rail"><span></span></span></button></div>`).join("")}
  </section>
  <section class="bloc">
    <div class="reglage"><span>Un jour férié</span>
      <select class="compacte" data-regler="planning.feries" aria-label="Jours fériés">
        ${[["normal", "comme d'habitude"], ["dimanche", "heure du dimanche"], ["aucun", "pas d'épisode"]].map(([v, n]) => `<option value="${v}" ${pl.feries === v ? "selected" : ""}>${n}</option>`).join("")}</select></div>
    ${interrupteur("Relancer si l'épisode n'est pas arrivé", pl.rattrapage, 'data-regler-bool="planning.rattrapage"')}
    ${pl.rattrapage ? `<div class="reglage"><span>Relancer après</span><select class="compacte" data-regler="planning.delai_rattrapage" aria-label="Délai du rattrapage">
      ${d.listes.delais.map((v) => `<option value="${v}" ${Number(pl.delai_rattrapage) === v ? "selected" : ""}>${v} min</option>`).join("")}</select></div>` : ""}
    <div class="reglage"><span>Préparation en avance<br><span class="aide">pour que l'épisode arrive à l'heure</span></span><select class="compacte" data-regler="planning.avance_minutes" aria-label="Préparation en avance">
      ${[0, 5, 10, 15, 20].map((v) => `<option value="${v}" ${Number(pl.avance_minutes) === v ? "selected" : ""}>${v} min</option>`).join("")}</select></div>
  </section>`;
}

// Une couleur par agenda, la même partout (liste, retrait, aperçu) : celle de son rang dans la liste.
const COULEURS_AGENDA = ["var(--aube)", "var(--bleu)", "var(--vert)", "#E8A0D8", "#C3C9D4", "#F2C14E", "#6FD6D6", "#B08CF2"];
function couleurAgenda(id) {
  const tous = [...S.d.reglages.agendas, ...(S.d.reglages.agendas_retires || [])].map((a) => a.id);
  return COULEURS_AGENDA[Math.max(0, tous.indexOf(id)) % COULEURS_AGENDA.length];
}
const pastilleAgenda = (id) => `<i class="pastille-ag" style="background:${couleurAgenda(id)}" aria-hidden="true"></i>`;

// Aperçu de l'agenda : les 7 prochains jours, tous agendas lus confondus.
function vueAgenda() {
  const d = S.d, evs = d.agenda_apercu || [];
  const agendas = d.reglages.agendas.map((a) => a.id);
  const jours = Array.from({ length: 7 }, (_, i) => plusJours(d.aujourdhui, i));
  const parJour = jours.map((date) => [date, evs.filter((ev) => ev.debut.slice(0, 10) === date || (ev.journee && ev.debut.slice(0, 10) < date && (ev.fin || "").slice(0, 10) > date))]);
  const nom = (date, i) => i === 0 ? "Aujourd'hui" : i === 1 ? "Demain" : majuscule(dateLongue(date));
  return `<section class="carte" aria-labelledby="t-agenda">
    <div class="entre"><h2 id="t-agenda">Mon agenda</h2><button type="button" class="lien" style="min-height:32px;padding:0" data-action="lire-agendas">Relire</button></div>
    ${evs.length ? `<div class="agenda">${parJour.filter(([, l]) => l.length).map(([date, l]) => `<div class="agenda-jour">
        <span class="agenda-date">${h(nom(date, jours.indexOf(date)))}</span>
        ${l.map((ev) => `<div class="agenda-ev"><i style="background:${couleurAgenda(ev.agenda)}"></i>
          <span class="agenda-h">${ev.journee ? "Journée" : h(ev.debut.slice(11, 16).replace(":", "h"))}</span>
          <span class="agenda-t">${h(ev.titre)}${ev.lieu ? `<br><span class="aide">${h(ev.lieu)}</span>` : ""}</span></div>`).join("")}
      </div>`).join("") || `<p class="aide">Rien dans les 7 prochains jours.</p>`}</div>
      ${d.agenda_lu ? `<p class="aide">Lu le ${h(dateLongue(d.agenda_lu.slice(0, 10)))} à ${h(d.agenda_lu.slice(11, 16).replace(":", "h"))}.</p>` : ""}`
    : `<p class="aide">L'aperçu apparaîtra après la prochaine lecture de tes agendas (chaque matin, ou avec « Relire »).</p>`}
  </section>`;
}

// Tant qu'une feuille est ouverte, la page derrière ne défile pas.
new MutationObserver(() => document.body.classList.toggle("feuille-ouverte", !document.getElementById("feuille").classList.contains("cache")))
  .observe(document.getElementById("feuille"), { attributes: true, attributeFilter: ["class"] });
// iPhone : seul un contenu qui défile vraiment reçoit le glissé ; le reste ne fait pas bouger la page.
document.getElementById("feuille").addEventListener("touchmove", (ev) => {
  if (ev.target.closest('input[type="range"]')) return;
  const zone = ev.target.closest(".defile, .panneau");
  if (!zone || zone.scrollHeight <= zone.clientHeight) ev.preventDefault();
}, { passive: false });

// ───────────────────────────── listes de choix ─────────────────────────────
// Les <select> restent dans la page (valeur, accessibilité au clavier), mais un
// appui ouvre une feuille de l'application au lieu du sélecteur du téléphone.
function ouvrirListe(sel) {
  if (sel.disabled) return;
  const el = document.getElementById("feuille");
  const etiquette = sel.getAttribute("aria-label") || (sel.id && document.querySelector(`label[for="${sel.id}"]`)?.textContent)
    || sel.closest(".reglage")?.querySelector("span")?.textContent || "Choisir";
  const ligne = (o) => `<button type="button" role="option" aria-selected="${o.selected}" data-liste-valeur="${h(o.value)}" ${o.disabled ? "disabled" : ""}>
    <span>${h(o.textContent)}</span>${o.selected ? icone("coche", 18, 2.4) : ""}</button>`;
  const contenu = [...sel.children].map((x) => x.tagName === "OPTGROUP"
    ? `<span class="groupe">${h(x.label)}</span>${[...x.children].map(ligne).join("")}` : ligne(x)).join("");
  el.innerHTML = `<div class="panneau">
    <div class="entete"><strong id="feuille-titre">${h(String(etiquette).trim())}</strong></div>
    <div class="choix liste-choix defile" role="listbox" aria-labelledby="feuille-titre">${contenu}</div>
    <button type="button" class="annuler" data-liste-valeur="" data-liste-fermer>Annuler</button></div>`;
  el.classList.remove("cache");
  const fermer = () => { el.classList.add("cache"); el.innerHTML = ""; el.onclick = null; document.removeEventListener("keydown", echap); sel.focus({ preventScroll: true }); };
  const echap = (ev) => { if (ev.key === "Escape") fermer(); };
  document.addEventListener("keydown", echap);
  el.onclick = (ev) => {
    ev.stopPropagation();
    const b = ev.target.closest("[data-liste-valeur]");
    if (!b && ev.target !== el) return;
    fermer();
    if (!b || b.dataset.listeFermer !== undefined || b.dataset.listeValeur === sel.value) return;
    sel.value = b.dataset.listeValeur;
    vibrer("choix");
    sel.dispatchEvent(new Event("change", { bubbles: true }));
  };
  const choisie = el.querySelector('[aria-selected="true"]') || el.querySelector("[data-liste-valeur]");
  if (choisie) { choisie.scrollIntoView({ block: "center" }); choisie.focus({ preventScroll: true }); }
}

// Un appui (sans glisser) sur une liste l'ouvre ; le <select> ne reçoit pas le toucher.
let appui = null;
document.addEventListener("pointerdown", (ev) => { appui = { x: ev.clientX, y: ev.clientY }; }, true);
document.addEventListener("pointerup", (ev) => {
  if (!appui || Math.hypot(ev.clientX - appui.x, ev.clientY - appui.y) > 10) return;
  appui = null;
  if (!document.getElementById("feuille").classList.contains("cache")) return;
  const sel = [...document.querySelectorAll("main select")].find((x) => {
    const r = x.getBoundingClientRect();
    return !x.disabled && r.width && ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
  });
  if (!sel) return;
  ev.preventDefault();
  // Le clic qui suit l'appui tomberait sur le fond de la feuille et la refermerait.
  const avaler = (e) => { e.stopPropagation(); e.preventDefault(); };
  document.addEventListener("click", avaler, { capture: true, once: true });
  setTimeout(() => document.removeEventListener("click", avaler, true), 600);
  ouvrirListe(sel);
});
document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "SELECT" && [" ", "Enter", "ArrowDown", "ArrowUp"].includes(ev.key) && !ev.altKey) { ev.preventDefault(); ouvrirListe(ev.target); }
});

// Toucher un jour du calendrier : changer son heure, ou pas d'épisode pendant N jours.
// L'heure s'applique dès qu'on la change (un jour qui a déjà un épisode) ; « Revenir à l'horaire
// habituel » efface le changement. Le nombre de jours sans épisode se choisit au curseur.
const J = { date: "", heure: "", nb: 1, envoi: null };
const MAX_JOURS_SANS = 30;
function toucherJour(date) {
  const d = S.d, pl = d.planning;
  if (date < d.aujourdhui) return;
  const habituelle = pl.jours[CLES_JOURS[dateObj(date).getUTCDay()]] || "";
  const c0 = jourCalendrier(date);
  if (J.date !== date) Object.assign(J, { date, heure: c0.heure || habituelle || "07:30", nb: 1 });
  const el = document.getElementById("feuille");
  // Ce qui dépend de l'état du jour (relu après chaque changement, sans toucher au champ de l'heure).
  const lire = () => {
    const c = jourCalendrier(date);
    const pause = S.d.planning.pauses.find((x) => date >= x.du && date <= x.au);
    const exception = S.d.planning.exceptions.find((x) => x.date === date);
    const etat = pause ? `Pas d'épisode : pause du ${dateLongue(pause.du)} au ${dateLongue(pause.au)}.`
      : c.heure ? `Épisode à ${heure(c.heure)}${exception ? " (heure changée pour ce jour)" : ""}.`
      : exception ? "Pas d'épisode ce jour-là." : "Pas d'épisode prévu ce jour-là.";
    return { c, pause, exception, etat: `${etat}${c.ferie ? ` Férié${c.ferie_nom ? ` : ${c.ferie_nom}` : ""}.` : ""}` };
  };
  const actionsHeure = ({ c, exception }) => {
    const retablir = exception ? `<button type="button" class="bouton gris" data-jour-faire="retablir">Revenir à l'horaire habituel</button>` : "";
    if (!c.heure) return `<button type="button" class="bouton gris" data-jour-faire="heure">Avoir un épisode ce jour-là</button>${retablir}`;
    return retablir || `<span class="aide">Change l'heure : elle compte tout de suite, pour ce jour seulement.</span>`;
  };
  const periodeTexte = () => {
    const fin = plusJours(date, J.nb - 1);
    return J.nb > 1 ? `Du ${dateLongue(date)} au ${dateLongue(fin)}` : `Seulement le ${dateLongue(date)}`;
  };
  const fermer = () => { clearTimeout(J.envoi); el.classList.add("cache"); el.innerHTML = ""; el.onclick = el.oninput = el.onchange = null; J.date = ""; };
  const majFeuille = () => {
    if (J.date !== date || el.classList.contains("cache")) return;
    const e = lire();
    if (e.pause) return toucherJour(date);
    const etatEl = el.querySelector("#j-etat"), actions = el.querySelector("#j-actions-heure");
    if (etatEl) etatEl.textContent = e.etat;
    if (actions) actions.innerHTML = actionsHeure(e);
  };
  const appliquer = (action, extra) => changer(action, extra, () => { dessiner(); majFeuille(); });
  const e = lire();
  el.innerHTML = `<div class="panneau">
    <div class="entete"><strong id="feuille-titre">${h(majuscule(dateLongue(date)))}</strong>
      <span id="j-etat">${h(e.etat)}</span></div>
    ${e.pause ? `<button type="button" class="annuler" style="background:var(--carte)" data-jour-faire="retirer-pause">Retirer cette pause</button>` : `
    <div class="bloc-jour">
      <div class="entre"><label for="j-heure" style="font-weight:600">Heure de l'épisode</label>
        <input id="j-heure" type="time" class="compacte" value="${h(J.heure)}" data-jour-heure></div>
      <div id="j-actions-heure" style="display:flex;flex-direction:column;gap:8px">${actionsHeure(e)}</div>
    </div>
    <div class="bloc-jour">
      <div class="entre"><label for="j-nb" style="font-weight:600">Pas d'épisode pendant</label>
        <output id="j-nb-texte" for="j-nb" style="font-weight:600;font-variant-numeric:tabular-nums">${J.nb} jour${J.nb > 1 ? "s" : ""}</output></div>
      <input id="j-nb" type="range" class="avance curseur-jours" min="1" max="${MAX_JOURS_SANS}" step="1" value="${J.nb}" data-jour-nb
        aria-valuetext="${J.nb} jour${J.nb > 1 ? "s" : ""}">
      <span class="aide" id="j-periode">${h(periodeTexte())}</span>
      <button type="button" class="bouton gris" style="color:var(--rouge)" data-jour-faire="sans">Pas d'épisode</button>
    </div>`}
    <button type="button" class="annuler" data-jour-faire="fermer">Fermer</button></div>`;
  el.classList.remove("cache");
  el.oninput = (ev) => {
    const t = ev.target;
    if (t.dataset.jourHeure !== undefined) J.heure = t.value;
    if (t.dataset.jourNb !== undefined) {
      J.nb = Math.max(1, Math.min(MAX_JOURS_SANS, Number(t.value) || 1));
      const texte = `${J.nb} jour${J.nb > 1 ? "s" : ""}`;
      el.querySelector("#j-nb-texte").textContent = texte;
      t.setAttribute("aria-valuetext", texte);
      el.querySelector("#j-periode").textContent = periodeTexte();
      vibrer("choix");
    }
  };
  // Un jour qui a un épisode : la nouvelle heure s'applique d'elle-même (une seule fois, quand on a fini de la régler).
  el.onchange = (ev) => {
    if (ev.target.dataset.jourHeure === undefined) return;
    J.heure = ev.target.value;
    clearTimeout(J.envoi);
    J.envoi = setTimeout(() => {
      const { c, exception } = lire();
      if (!J.heure || !c.heure || J.heure === c.heure) return;
      if (J.heure === habituelle && exception) appliquer("retablir", { date });
      else appliquer("exception", { date, heure: J.heure });
    }, 700);
  };
  el.onclick = (ev) => {
    ev.stopPropagation();
    const b = ev.target.closest("button");
    if (!b && ev.target === el) return fermer();
    if (!b || b.disabled) return;
    const faire = b.dataset.jourFaire;
    if (!faire) return;
    const nb = J.nb, h0 = J.heure, pause = lire().pause;
    if (faire === "fermer") return fermer();
    if (faire === "heure") {
      if (!h0) return annoncer("Choisis une heure.", true);
      clearTimeout(J.envoi);
      return appliquer("exception", { date, heure: h0 });
    }
    if (faire === "retablir") { clearTimeout(J.envoi); J.heure = habituelle || J.heure; const champ = el.querySelector("#j-heure"); if (champ && habituelle) champ.value = habituelle; return appliquer("retablir", { date }); }
    fermer();
    if (faire === "sans") return nb > 1 ? changer("pause", { du: date, au: plusJours(date, nb - 1) }) : changer("exception", { date, heure: null });
    if (faire === "retirer-pause" && pause) return changer("retirer_pause", { du: pause.du });
  };
  const premier = el.querySelector("[data-jour-heure], [data-jour-faire]");
  if (premier && !el.contains(document.activeElement)) premier.focus();
}

// ─────────────────────────────── réglages ───────────────────────────────
// Ce qui ne dépend d'aucune rubrique. Les réglages d'une rubrique sont dans sa fiche.
const nomPays = () => (S.d.listes.pays.find(([c]) => c === S.d.pays) || [, ""])[1];
const SECTIONS = [
  ["moi", "Moi", "moi", (r) => [r.voix.prenom || "prénom ?", r.actus.ville || "ville ?", nomPays()].filter(Boolean).join(" · ")],
  ["voix", "Voix", "voix", (r) => `${r.voix.animateurs.map((a) => a.nom).join(" & ")} · vitesse ${r.voix.vitesse}`],
  ["style", "Durée et style", "format", (r) => `${nombre(r.format.duree_minutes)} min · ${(S.d.listes.tons[r.format.ton] || "").toLowerCase()} · ${r.consignes.length ? `${r.consignes.length} consigne${r.consignes.length > 1 ? "s" : ""}` : "aucune consigne"}`],
  ["sources", "Sources", "sources", () => {
    const s = S.d.reglages.sources, n = (x, mot) => `${x} ${mot}${x > 1 ? "s" : ""}`;
    const services = s.categories.filter((c) => c.type === "services" && !c.coupee).length;
    return `${n(services, "service")} · ${s.flux.length} flux · ${n(s.sites.length, "site")} · ${n(S.d.reglages.agendas.length, "agenda")}`;
  }],
  ["gemini", "Gemini", "cle", () => {
    const k = S.d.connexions.cles.gemini;
    return k.source === "app" ? `Clé dans l'application · …${k.fin}` : k.source === "github" ? "Clé dans le secret GitHub" : k.source === "absente" ? "Clé manquante : rien ne part" : "Clé vérifiée au prochain épisode";
  }],
  ["application", "Application", "telephone", () => `Version ${S.d.version}${S.d.flux ? " · flux privé actif" : ""}`],
];

function vueReglages() {
  const r = S.d.reglages;
  return `<h1>Réglages</h1>
  <div class="menu-reglages">${SECTIONS.map(([cle, nom, ic, detail]) => `<button type="button" data-reglage="${cle}">
    <span style="color:var(--aube)">${icone(ic, 22)}</span><span class="textes"><span style="font-weight:600">${nom}</span><span class="detail">${h(detail(r))}</span></span>
    <span style="color:var(--eteint)">${icone("suite", 18, 2)}</span></button>`).join("")}</div>
  <p class="aide">Agenda, actualités, médias, sujets à creuser : chaque rubrique se règle dans sa fiche, depuis l'onglet Épisode.</p>
  ${S.d.annulation ? `<div class="annul"><span>Dernier changement : ${h(S.d.annulation)}</span><button type="button" class="lien" style="min-height:36px;padding:0 10px" data-action="annuler">Annuler</button></div>` : ""}`;
}

// Un nombre se choisit dans une liste (la valeur change tout de suite, un seul envoi au bot).
const pas = (chemin, valeur, min, max, saut, unite = "") => {
  const valeurs = [];
  for (let v = saut > 1 ? saut : min; v <= max; v = Math.round((v + saut) * 10) / 10) valeurs.push(v);
  if (!valeurs.includes(Number(valeur))) valeurs.push(Number(valeur));
  valeurs.sort((x, y) => x - y);
  return choix(chemin, valeur, valeurs.map((v) => [v, `${nombre(v)}${unite}`]));
};

const choix = (chemin, valeur, options) => `<select class="compacte" data-regler="${chemin}">
  ${options.map(([v, n]) => `<option value="${h(v)}" ${String(valeur) === String(v) ? "selected" : ""}>${h(n)}</option>`).join("")}</select>`;

function etiquettes(chemin, valeurs, exemple) {
  return `${valeurs.length ? `<div class="etiquettes">${valeurs.map((v, i) => `<span>${h(v)}<button type="button" data-retirer-liste="${chemin}" data-i="${i}" aria-label="Retirer ${h(v)}">${icone("croix", 14, 2)}</button></span>`).join("")}</div>` : ""}
  <div class="ajout"><input class="saisie" type="text" maxlength="80" placeholder="${h(exemple)}" data-nouveau="${chemin}" aria-label="Ajouter"><button type="button" class="bouton gris" data-ajouter-liste="${chemin}">Ajouter</button></div>`;
}

// Une liste de consignes (le style de tout l'épisode, ou celles d'une rubrique fournie) : chacune se
// corrige sur place ; on en ajoute une toute prête ou la sienne. « chemin » : consignes ou consignes_rubriques.<clé>.
const sansPoint = (c) => String(c).replace(/[ .;,]+$/, "");
function blocConsignes(chemin, valeurs, pretes, exemple, suggestion = () => "") {
  const id = chemin.replace(/\W+/g, "-");
  const deja = new Set(valeurs.map(sansPoint));
  const restantes = (pretes || []).filter((c) => !deja.has(sansPoint(c)));
  return `${valeurs.map((c, i) => `<div class="sous-bloc"><textarea class="saisie" rows="2" maxlength="300" data-consigne="${i}" data-liste="${chemin}" aria-label="Consigne ${i + 1}">${h(c)}</textarea>
      ${suggestion(c, i)}
      <button type="button" class="lien" style="align-self:flex-end;color:var(--rouge)" data-retirer-liste="${chemin}" data-i="${i}">Supprimer</button></div>`).join("")}
    ${restantes.length ? `<div class="champ"><label for="prete-${id}">Consigne toute prête</label><select id="prete-${id}" class="saisie" data-consigne-prete="${chemin}">
      <option value="">Choisir dans la liste…</option>${restantes.map((c) => `<option>${h(c)}</option>`).join("")}</select></div>` : ""}
    <div class="champ"><label for="n-${id}">${restantes.length ? "Ou écris la tienne" : "Écris ta consigne"}</label><textarea id="n-${id}" class="saisie" rows="2" maxlength="300" data-nouveau="${chemin}" placeholder="${h(exemple)}"></textarea>
      <button type="button" class="bouton gris" data-ajouter-liste="${chemin}">Ajouter</button></div>`;
}

// Une consigne qui parle d'un rendez-vous est une consigne d'agenda (ou un rappel selon l'agenda) déguisée.
const RAPPEL_AGENDA = /(é|e)v(é|e)nement|rendez-vous|\brdv\b|agenda|la veille|jour m(ê|e)me|rappelle|n'oublie|quand j'ai|si mon/i;
function rubriqueDepuisConsigne(i) {
  const texte = S.d.reglages.consignes[i] || "";
  const nom = (/(?:événement|evenement|rendez-vous|agenda indique|agenda contient)\s+[«"]?\s*([^\s,:;»"]+)/i.exec(texte) || [])[1] || "";
  const moment = /la veille/i.test(texte) ? "veille" : "jour_meme";
  ouvrirFiche(null, { id: "rappel", depuisConsigne: i, f: { titre: nom ? `Rappel ${nom}` : "Rappel", consigne: texte, longueur: "phrase", place: "agenda",
    condition: { texte: nom, moment, n: 1 } } });
}

// Réglages › Moi (et premier lancement) : les quatre champs ont la même largeur, alignés à droite,
// l'interrupteur du tutoiement en dessous.
function blocMoi() {
  const d = S.d, r = d.reglages;
  return `<section class="bloc">
    <div class="reglage"><span>Ton prénom</span><input class="compacte champ-moi" maxlength="40" value="${h(r.voix.prenom)}" data-regler-texte="voix.prenom" placeholder="Facultatif" aria-label="Ton prénom"></div>
    <div class="reglage"><span>Pays</span><select class="compacte champ-moi" data-regler="pays" aria-label="Pays">
      ${d.listes.pays.map(([v, n]) => `<option value="${h(v)}" ${String(d.pays) === String(v) ? "selected" : ""}>${h(n)}</option>`).join("")}</select></div>
    ${d.pays === "CH" ? `<div class="reglage"><span>Canton<br><span class="aide">jours fériés</span></span>
      <select class="compacte champ-moi" data-region aria-label="Canton des jours fériés">
      ${d.listes.regions.map(([c, n]) => `<option value="${c}" ${d.planning.feries_region === c ? "selected" : ""}>${h(n.replace("Suisse · ", ""))}</option>`).join("")}</select></div>` : ""}
    <div class="reglage"><span>Ta ville</span><input class="compacte champ-moi" maxlength="60" value="${h(r.actus.ville)}" data-regler-texte="actus.ville" placeholder="Facultatif" aria-label="Ta ville"></div>
    ${interrupteur("Les animateurs te tutoient", r.voix.tutoiement, 'data-regler-bool="voix.tutoiement"')}
  </section>`;
}

function vueReglage() {
  const d = S.d, r = d.reglages, cle = S.reglage;
  const titre = (SECTIONS.find((s) => s[0] === cle) || [])[1] || "Réglages";
  const corps = {
    moi: () => `${blocMoi()}
      <p class="aide">Le prénom et la ville sont facultatifs. Le pays règle l'heure, la devise, les jours fériés, les fêtes nationales mises en avant et les médias proposés par défaut ; « Pas renseigné » les laisse de côté. La ville sert à l'actu locale, à la météo, aux trains et à repérer tes déplacements.</p>`,
    voix: () => vueVoix(),
    sources: () => vueSources(),
    gemini: () => vueGemini(),
    style: () => `<section class="bloc">
        <div class="reglage"><span>Durée visée</span><output id="duree-valeur" style="font-weight:600;font-variant-numeric:tabular-nums">${h(nombre(r.format.duree_minutes))} min</output></div>
        <input type="range" class="avance" min="2" max="12" step="0.5" value="${r.format.duree_minutes}" data-duree aria-label="Durée visée en minutes" style="margin:6px 0 10px">
        <div class="puces-choix">${[3, 5, 8, 10, 12].map((v) => `<button type="button" data-pas="format.duree_minutes" data-valeur="${v}" aria-pressed="${Number(r.format.duree_minutes) === v}">${v} min</button>`).join("")}</div>
        <p class="aide">Glisse le curseur ou touche une durée. Gemini écrit parfois plus court que demandé : le podcast mesure ce qu'il écrit vraiment et demande un peu plus la fois suivante, tout seul.</p>
      </section>
      <div class="champ"><label for="choix-ton">Ton</label><select id="choix-ton" class="saisie" data-regler="format.ton">
        ${Object.entries(d.listes.tons).map(([v, n]) => `<option value="${v}"${r.format.ton === v ? " selected" : ""}>${h(n)}</option>`).join("")}</select>
        <p class="aide">${h((d.listes.descriptions_tons || {})[r.format.ton] || "")}</p></div>
      <h2 style="margin-top:6px">Consignes de style</h2>
      <p class="aide">Pour tout l'épisode : le ton, le rythme, les transitions. Une consigne propre à une rubrique (l'agenda, les actualités…) se met dans sa fiche, depuis l'onglet Épisode.</p>
      ${blocConsignes("consignes", r.consignes, d.listes.consignes_pretes, "Ex. plus d'humour le vendredi", (c, i) => RAPPEL_AGENDA.test(c)
        ? `<div class="suggestion"><span>Elle parle de ton agenda : sa place est dans la rubrique Agenda.</span>
          <button type="button" class="lien" data-consigne-agenda="${i}">La ranger dans l'Agenda</button>
          <button type="button" class="lien" data-consigne-rubrique="${i}">En faire un rappel selon l'agenda</button></div>` : "")}`,
    application: () => `${vueAppareils(d)}
      <section class="carte" aria-labelledby="t-flux"><h2 id="t-flux">Dans ton appli de podcasts</h2>
        <p class="aide">Écoute tes épisodes dans Apple Podcasts, AntennaPod… : téléchargés pendant la nuit, sur l'écran verrouillé et en voiture.</p>
        ${d.flux ? `<input class="saisie" id="adresse-flux" readonly value="${h(d.flux)}" aria-label="Adresse de ton flux privé" style="font-size:13px">
          <div class="deux"><button type="button" class="bouton plein" data-action="copier-flux">Copier l'adresse</button>
            <button type="button" class="bouton gris" data-action="renouveler-flux">Changer l'adresse</button></div>
          <p class="aide"><b>Apple Podcasts</b> : Bibliothèque › ⋯ › Ajouter une émission par URL. <b>AntennaPod</b> : + › Ajouter un podcast par son adresse RSS. Garde cette adresse pour toi : qui l'a peut écouter tes épisodes.</p>`
          : `<button type="button" class="bouton plein" data-action="creer-flux">Créer mon flux privé</button>`}
      </section>
      <section class="carte" aria-labelledby="t-version"><h2 id="t-version">Version</h2>
        <p class="aide">Tu as la version ${h(d.version)}. Le dernier changement de réglage s'annule depuis la page Réglages.</p>
        ${d.stockage ? `<p class="aide">Épisodes gardés par ton bot (un an) : ${h(tailleLisible(d.stockage))} sur 5 Go offerts.</p>` : ""}
        ${d.maj_etat && d.maj_etat.etat === "en_cours" ? `<p class="aide" style="color:var(--aube-clair)">Mise à jour vers la version ${h(d.maj_etat.version)} en cours : compte deux à trois minutes, puis rouvre l'application.</p>` : ""}
        ${d.maj_etat && d.maj_etat.etat === "erreur" ? `<p class="aide" style="color:var(--rouge)">La mise à jour n'a pas abouti : ${h(d.maj_etat.message)}</p>` : ""}
        ${d.maj_etat && d.maj_etat.etat === "fait" && d.maj_etat.message ? `<p class="aide">Dernière mise à jour : ${h(d.maj_etat.message)}</p>` : ""}

  }[cle];
  return `${entete(titre, "Réglages")}${corps ? corps() : ""}`;
}

// Chaque voix est un animateur possible, appelé par son prénom (son nom de voix
// tant qu'on ne lui en donne pas). Les habituels, les jours et le tirage au sort
// se choisissent parmi les voix utilisées.
function vueVoix() {
  const d = S.d, r = d.reglages, v = r.voix;
  const nomDe = (voix) => (v.noms || {})[voix] || voix;
  const utilisee = (voix) => !(v.inactives || []).includes(voix);
  const habituelles = v.animateurs.map((a) => a.voix);
  const voulus = v.solo ? 1 : 2;
  // Dans la case : le prénom seul ; dans la feuille de choix : la voix et son timbre.
  const optionsVoix = (choisie) => [["Voix féminines", "f"], ["Voix masculines", "m"]].map(([groupe, genre]) => {
    const liste = d.listes.voix.filter((x) => x.genre === genre && (utilisee(x.nom) || x.nom === choisie))
      .sort((a, b) => nomDe(a.nom).localeCompare(nomDe(b.nom), "fr"));
    return liste.length ? `<optgroup label="${groupe}">${liste.map((x) => `<option value="${x.nom}" label="${h(nomDe(x.nom))}" ${choisie === x.nom ? "selected" : ""}>${h(nomDe(x.nom))}${nomDe(x.nom) !== x.nom ? ` · ${x.nom}` : ""} — ${h(x.description)}</option>`).join("")}</optgroup>` : "";
  }).join("");
  const aideMode = {
    fixe: `${v.solo ? "L'animateur habituel présente" : "Les animateurs habituels présentent"} chaque épisode.`,
    jours: "Choisis qui présente chaque jour.",
    aleatoire: `Chaque épisode tire au sort ${v.solo ? "une voix" : "deux voix"} parmi les ${d.listes.voix.filter((x) => utilisee(x.nom)).length} voix utilisées (« Les voix », plus bas).`,
  }[v.mode] || "";
  const ligneVoix = (x) => {
    const nom = nomDe(x.nom), active = utilisee(x.nom), habituelle = habituelles.includes(x.nom);
    const pret = r.echantillons[x.nom] && r.temps_echantillons[x.nom];
    const enCours = X.voix === x.nom && !extrait.paused;
    const timbre = `${nom !== x.nom ? `${x.nom} · ` : ""}${x.description}${habituelle && v.mode === "fixe" ? " · habituel" : ""}`;
    return `<div class="voix-ligne${active ? "" : " eteinte"}">
      <input class="nom-voix" maxlength="20" value="${h(nom === x.nom ? "" : nom)}" placeholder="${x.nom}" data-nom-voix="${x.nom}" autocomplete="off" spellcheck="false" enterkeyhint="done" aria-label="Prénom de la voix ${x.nom}">
      <span class="aide timbre" title="${h(timbre)}">${h(timbre)}</span>
      ${pret ? `<button type="button" class="rond" data-extrait="${x.nom}" aria-label="${enCours ? "Pause" : "Écouter"} ${h(nom)}">${enCours ? PAUSE : LECTURE}</button>`
        : `<button type="button" class="rond" role="checkbox" aria-checked="${S.aPreparer.includes(x.nom)}" data-a-preparer="${x.nom}" aria-label="Préparer l'extrait de ${h(nom)}">${S.aPreparer.includes(x.nom) ? icone("coche", 16, 2.2) : icone("telecharger", 16, 2)}</button>`}
      <button type="button" class="mini-inter" role="switch" aria-checked="${active}" data-voix-active="${x.nom}" aria-label="Utiliser ${h(nom)}"><span class="rail"><span></span></span></button></div>`;
  };
  return `<section class="bloc">
      <div class="reglage"><span>Vitesse</span>${choix("voix.vitesse", v.vitesse, d.listes.vitesses.map((x) => [x, majuscule(x)]))}</div>
    </section>
    <section class="carte" aria-labelledby="t-anim">
      <h2 id="t-anim">Animateurs</h2>
      <p class="aide" style="font-size:14px;color:var(--doux-2)">Prochain épisode : ${h(v.du_prochain.map((a) => a.nom).join(" & "))}</p>
      <div class="segments" style="grid-template-columns:repeat(3,minmax(0,1fr));background:var(--carte-2)">
        ${Object.entries(d.listes.modes_voix).map(([m, n]) => `<button type="button" style="font-size:13px" data-valeur-segment="${m}" data-chemin="voix.mode" aria-pressed="${v.mode === m}">${n}</button>`).join("")}</div>
      <div class="bloc" style="background:var(--carte-2)">${interrupteur("Une seule voix (sans second animateur)", v.solo, 'data-regler-bool="voix.solo"')}</div>
      ${v.mode === "fixe" ? `<span class="groupe">Animateurs habituels</span>
      <div class="bloc" style="background:var(--carte-2)">
        ${v.animateurs.map((a, i) => `<div class="reglage${v.solo && i === 1 ? " grise" : ""}"><span>Animateur ${i + 1}${v.solo && i === 1 ? '<br><span class="aide">Pas utilisé avec une seule voix</span>' : ""}</span>
          <select class="compacte choix-voix" data-regler="voix.animateurs.${i}.voix" aria-label="Animateur habituel ${i + 1}">${optionsVoix(a.voix)}</select></div>`).join("")}
      </div>` : ""}
      <p class="aide">${aideMode}</p>
      ${v.mode === "jours" ? `<div class="bloc" style="background:var(--carte-2)">${d.listes.jours.map(([j, court, long]) => `<div class="jour-voix${d.planning.jours[j] ? "" : " grise"}">
          <span title="${majuscule(long)}${d.planning.jours[j] ? "" : " : pas d'épisode"}">${court}</span>
          <div style="--places:${voulus}">${(v.jours[j] || habituelles).slice(0, voulus).map((x, i) => `<select class="compacte choix-voix" data-voix-jour="${j}" data-place="${i}" aria-label="${majuscule(long)} : animateur ${i + 1}">${optionsVoix(x)}</select>`).join("")}</div></div>`).join("")}</div>
        ${Object.values(d.planning.jours).some((x) => !x) ? `<p class="aide">Les jours grisés n'ont pas d'épisode (Planning).</p>` : ""}` : ""}
    </section>
    <section class="carte" aria-labelledby="t-ecoute"><h2 id="t-ecoute">Les voix</h2>
      <p class="aide">Chaque voix est un animateur possible, appelé par son prénom : écris-en un pour la renommer, ou laisse vide pour garder son nom. Coupe celles que tu ne veux pas entendre.</p>
      <p class="aide">Pour écouter une voix, touche sa flèche de téléchargement puis « Préparer » (16 extraits par jour au plus) ; la flèche devient alors un bouton lecture.</p>
      ${[["Conseillées", (x) => x.conseillee], ["Voix féminines", (x) => !x.conseillee && x.genre === "f"], ["Voix masculines", (x) => !x.conseillee && x.genre === "m"]]
        .map(([groupe, filtre]) => `<span class="groupe">${groupe}</span><div class="bloc" style="background:var(--carte-2)">${d.listes.voix.filter(filtre).map(ligneVoix).join("")}</div>`).join("")}
      ${S.aPreparer.length ? `<button type="button" class="bouton plein" data-action="extraits">Préparer ${S.aPreparer.length > 1 ? `ces ${S.aPreparer.length} extraits` : "cet extrait"}</button>` : ""}
    </section>`;
}

// ─────────────────────────────── connexions ─────────────────────────────
// Clés et agendas : saisis ici, testés par le bot, jamais réaffichés en entier.
function etatCle(k) {
  if (k.source === "app") return `<span class="badge ok">Dans l'application · …${h(k.fin)}</span>`;
  if (k.source === "github") return `<span class="badge ok">Secret GitHub</span>`;
  if (k.source === "absente") return `<span class="badge ${k.obligatoire ? "manque" : "neutre"}">${k.obligatoire ? "Manquante" : "Pas encore"}</span>`;
  return `<span class="badge neutre">Vérifiée au prochain épisode</span>`;
}

// Dernier test d'une clé : ce qu'il a appris (modèles, recherches restantes…), ou en cours.
function testCle(k) {
  const t = k.test;
  if (!t) return "";
  if (t.en_cours) return `<p class="test-cle" role="status">⏳ Test en cours sur GitHub (ta clé y est rangée) : le résultat arrive dans une minute environ.</p>`;
  const quand = t.quand ? ` <span style="opacity:.75">· ${h(dateLongue(t.quand.slice(0, 10)))} à ${h(t.quand.slice(11, 16))}${t.ou === "github" ? ", testée sur GitHub" : ""}</span>` : "";
  return `<p class="test-cle ${t.ok ? "ok" : t.ok === false || t.perdu ? "ko" : ""}" role="status">${t.ok ? "✓" : "✗"} ${h(t.message)}${quand}</p>`;
}

// Suivi d'un test lancé sur GitHub : on redemande l'état jusqu'au résultat (3 minutes au plus).
let suiviTests = null;
// Les tests partis sur GitHub : des clés (par leur nom) et des outils (par leur clé « flux:… »).
const outilsEnTest = () => {
  const s = S.d && S.d.reglages && S.d.reglages.sources;
  if (!s) return [];
  return [...s.categories.map((c) => [`service:${c.cle}`, c.test]), ...s.flux.map((f) => [f.cle, f.test]), ...s.sites.map((x) => [x.cle, x.test])]
    .filter(([, t]) => t && t.en_cours).map(([cle]) => cle);
};
const clesEnTest = () => [...Object.values((S.d && S.d.connexions && S.d.connexions.cles) || {}).filter((k) => k.test && k.test.en_cours).map((k) => k.nom), ...outilsEnTest()];
function testDeCle(cle) {
  const s = S.d.reglages.sources;
  if (cle.startsWith("service:")) return (s.categories.find((c) => `service:${c.cle}` === cle) || {}).test;
  return ([...s.flux, ...s.sites].find((x) => x.cle === cle) || {}).test;
}
function suivreTestsCles(essai = 0, attendues = clesEnTest()) {
  clearTimeout(suiviTests);
  suiviTests = setTimeout(async () => {
    const j = await demander("etat", {}, { discret: true });
    if (j.occupe) return suivreTestsCles(essai, attendues);
    const toujours = clesEnTest();
    if (S.ecran === "reglage" && ["sources", "gemini"].includes(S.reglage)) dessiner();
    Object.values(S.d.connexions.cles).filter((k) => attendues.includes(k.nom) && !toujours.includes(k.nom) && k.test)
      .forEach((k) => annoncer(`${k.nom} : ${k.test.message}`, !k.test.ok));
    attendues.filter((cle) => cle.includes(":") && !toujours.includes(cle)).forEach((cle) => { const t = testDeCle(cle); if (t) annoncer(t.message, !t.ok); });
    if (toujours.length && essai < 22) suivreTestsCles(essai + 1, toujours);
  }, 8000);
}

// Une clé : son état, son dernier test, le champ pour la coller ou la tester. « dansService » :
// rangée dans la carte de son service (Réglages › Sources › Services).
function corpsCle(nom, k, dansService = false) {
  const enregistree = k.source === "app" || k.source === "github" || k.source === "inconnue";
  return `${dansService ? `<div class="entre"><span style="font-weight:600">Clé ${h(k.nom)}${k.obligatoire ? "" : ' <span class="aide" style="font-weight:400">facultative</span>'}</span>${etatCle(k)}</div>
      <p class="aide" style="margin:0">${h(k.role)}</p>` : ""}
    ${testCle(k)}
    <div class="ajout"><input class="saisie" type="password" autocomplete="off" spellcheck="false" maxlength="300" placeholder="${k.source === "absente" ? "Colle ta clé ici" : "Nouvelle clé"}" data-nouveau="cle-${nom}" aria-label="Clé ${h(k.nom)}">
      <button type="button" class="bouton gris" data-tester-cle="${nom}">Tester</button></div>
    ${enregistree ? `<p class="aide" style="margin-top:-4px">Laisse le champ vide pour tester la clé déjà enregistrée${k.source === "github" ? " (rangée dans GitHub : le test y passe, une minute environ)" : ""}.</p>` : ""}
    <div class="entre"><button type="button" class="lien" data-lien="${h(k.lien)}">Où la trouver ?</button>
      ${k.source === "app" ? `<button type="button" class="lien" style="color:var(--rouge)" data-cle-retirer="${nom}">Retirer</button>` : ""}</div>`;
}

function carteCle(nom, k, compacte = false) {
  return `<section class="carte" aria-labelledby="t-cle-${nom}">
    <div class="entre"><h2 id="t-cle-${nom}">${h(k.nom)}${k.obligatoire ? "" : ' <span class="aide" style="font-weight:400">facultatif</span>'}</h2>${etatCle(k)}</div>
    ${compacte ? "" : `<p class="aide">${h(k.role)}</p>`}
    ${corpsCle(nom, k)}
  </section>`;
}

async function bienvenueSuivante(sens) {
  const etape = ETAPES_BIENVENUE[B.etape];
  if (sens > 0 && etape === "heure") {
    // Les heures choisies, jour par jour (le planning garde ensuite la main).
    for (const j of ["lun", "mar", "mer", "jeu", "ven"]) await demander("jour", { jour: j, heure: B.semaine }, { discret: true });
    for (const j of ["sam", "dim"]) await demander("jour", { jour: j, heure: B.weekendActif ? B.weekend : null }, { discret: true });
  }
  if (sens > 0 && B.etape === ETAPES_BIENVENUE.length - 1) {
    await demander("bienvenue_fin", {}, { discret: true });
    S.ecran = "programme";
    annoncer("Tout est prêt.");
    return dessiner();
  }
  B.etape = Math.max(0, Math.min(ETAPES_BIENVENUE.length - 1, B.etape + sens));
  dessiner();
  window.scrollTo(0, 0);
}

// d'articles, l'âge maximum des nouvelles, les thèmes préférés et à éviter).
const AGES_ACTUS = [[12, "12 h"], [24, "24 h"], [36, "36 h"], [48, "2 jours"], [72, "3 jours"], [168, "1 semaine"], [336, "2 semaines"]];
function corpsActus(locale) {
  const r = S.d.reglages, a = r.actus;
  const c = locale
    ? { sujets: "actus.locale_sujets", articles: "actus.locale_articles", age: "actus.locale_fraicheur_heures", preferes: "actus.locale_preferes", eviter: "actus.locale_a_eviter" }
    : { sujets: "format.nombre_sujets", articles: "actus.articles", age: "actus.fraicheur_heures", preferes: "actus.sujets_preferes", eviter: "actus.sujets_a_eviter" };
  const valeur = (chemin) => chemin === "format.nombre_sujets" ? r.format.nombre_sujets : a[chemin.split(".")[1]];
  const age = Number(valeur(c.age));
  const ages = AGES_ACTUS.filter(([v]) => locale ? v >= 24 : v <= 168);
  return `<section class="bloc">
      ${locale ? `<div class="reglage"><span>Ta ville<br><span class="aide">${h(a.ville || "pas encore précisée")}</span></span><button type="button" class="lien" data-reglage="moi">Changer</button></div>`
        : ""}
      <div class="reglage"><span>Nombre de sujets</span>${pas(c.sujets, valeur(c.sujets), 1, locale ? 5 : 8, 1)}</div>
      <div class="reglage"><span>Articles lus</span>${locale ? pas(c.articles, valeur(c.articles), 1, 10, 1) : pas(c.articles, valeur(c.articles), 5, 60, 5)}</div>
      <div class="reglage"><span>Âge maximum des nouvelles</span>${choix(c.age, age, ages.concat(ages.some(([v]) => v === age) ? [] : [[age, `${age} h`]]))}</div>
    </section>
    <div class="champ"><span class="etiquette">Thèmes préférés</span>${etiquettes(c.preferes, valeur(c.preferes), locale ? "Ex. travaux, culture" : "Ex. vélo, économie")}</div>
    <div class="champ"><span class="etiquette">Thèmes à éviter</span>${etiquettes(c.eviter, valeur(c.eviter), locale ? "Ex. faits divers" : "Ex. sport, people")}</div>
    <p class="aide">${locale
      ? "Chaque matin, une recherche Google Actualités sur ta ville, plus une par thème préféré (trois au plus), et les flux cochés dans « Où elle cherche ». Parmi les articles lus, les animateurs racontent les sujets les plus utiles ; la rubrique ne passe que s'il y a du nouveau."
      : "Chaque matin, les flux cochés dans « Où elle cherche », plus une recherche Google Actualités par thème préféré (trois au plus). Parmi les articles lus, les animateurs choisissent les sujets à raconter."}
      Les actus déjà racontées les jours précédents sont écartées.</p>`;
}
